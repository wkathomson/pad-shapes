<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>Pad Shapes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pad Shapes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Fonts are bundled so the app looks the same offline.
     Instrument Sans has no ♭ ♯, so a tiny Noto Music subset supplies them. */
  @font-face {
    font-family: 'Instrument Sans'; font-style: normal; font-weight: 400 700; font-stretch: 75% 100%; font-display: swap;
    src: url('fonts/instrument-sans-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'PadAccidentals'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/noto-music-accidentals.woff2') format('woff2');
    unicode-range: U+266D-266F;
    size-adjust: 135%; ascent-override: 72%; descent-override: 10%;
  }

  :root {
    /* Graphite greys in the spirit of a dark DAW theme */
    --bg: #141414;
    --surface: #1e1e1e;
    --surface-2: #282828;
    --surface-3: #343434;
    --line: #333333;
    --line-soft: #2a2a2a;
    --text: #ececec;
    --muted: #949494;
    --faint: #5f5f5f;
    /* Hardware-style accents */
    --accent: #ffa43a;
    --accent-hi: #ffc06e;
    --accent-ink: #201304;
    --accent-glow: rgba(255, 164, 58, .5);
    --root: #4f95ff;
    --root-glow: rgba(79, 149, 255, .35);
    --pad-in: #d0d0d0;
    --pad-in-text: #1b1b1b;
    --pad-out: #232323;
    --pad-out-text: #5a5a5a;
    --pad-void: #0d0d0d;
    --warn: #ff5a4c;
    --ok: #63d47c;
    --gap: 4px;
    --radius: 10px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.3, 1.4, .5, 1);
    --font: 'Instrument Sans', 'PadAccidentals', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.3 var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  button, select, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, select:focus-visible, [tabindex]:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .label, .sel span, .field > span, .inv-btn small, .prog h3, .borrowed-row .tag {
    font-size: 10.5px; font-weight: 600; font-stretch: 85%; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
  }

  #app {
    max-width: 520px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 66px);
    display: flex; flex-direction: column; gap: 8px;
  }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .stack[hidden], .play[hidden], .prog[hidden] { display: none; }

  /* ---- Shared controls ---- */
  .sel {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 4px 11px; min-width: 0; position: relative;
    transition: border-color .2s var(--ease), background-color .2s var(--ease);
  }
  .sel::after {
    content: ''; position: absolute; right: 11px; bottom: 11px; width: 6px; height: 6px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg);
    pointer-events: none;
  }
  .sel:active { background: var(--surface-2); }
  .sel.grow { flex: 1; }
  .sel select {
    background: transparent; border: 0; padding: 0 14px 0 0; font-size: 16px; font-weight: 650;
    min-width: 0; width: 100%; outline: none; -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .sel select option { background: var(--surface); color: var(--text); }

  .icon-btn {
    width: 46px; flex: none; border-radius: var(--radius); border: 1px solid var(--line-soft);
    background: var(--surface); font-size: 20px; cursor: pointer; color: var(--muted);
    transition: transform .15s var(--spring), background-color .2s, color .2s;
  }
  .icon-btn:active { transform: scale(.92) rotate(30deg); color: var(--text); }

  /* Segmented control with a sliding thumb (positioned from script) */
  .seg {
    position: relative; display: flex; background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--radius); padding: 3px; gap: 2px; isolation: isolate;
  }
  .seg::before {
    content: ''; position: absolute; z-index: -1; top: 3px; bottom: 3px; left: 0;
    width: var(--tw, 0); transform: translateX(var(--tx, 0)); border-radius: 7px;
    background: var(--thumb, var(--text)); opacity: 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 0 0 .5px rgba(255,255,255,.06) inset;
  }
  .seg.has-thumb::before { opacity: 1; }
  .seg[data-ready]::before { transition: transform .32s var(--ease), width .32s var(--ease), opacity .2s; }
  .seg button {
    flex: 1; border: 0; border-radius: 7px; background: transparent;
    padding: 8px 6px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap;
    transition: color .2s var(--ease), transform .15s var(--spring);
  }
  .seg button:active { transform: scale(.95); }
  .seg button[aria-checked="true"], .seg button[aria-selected="true"] { color: var(--thumb-ink, var(--bg)); }
  .seg.mode { flex: 1.4; --thumb: var(--text); }
  .seg.mode button { font-size: 15px; letter-spacing: .01em; }
  .summary {
    flex: 1; border: 1px solid var(--line-soft); border-radius: var(--radius); background: var(--surface);
    color: var(--muted); font-size: 12px; font-weight: 550; padding: 4px 8px; cursor: pointer; text-align: center;
    font-variant-numeric: tabular-nums; transition: background-color .2s, transform .15s var(--spring);
  }
  .summary:active { transform: scale(.97); background: var(--surface-2); }

  .notice { background: #2e2410; color: #ffd48a; border-radius: 8px; padding: 8px 10px; font-size: 13px; }

  /* ---- Header ---- */
  .bar { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: flex; gap: 6px; align-items: stretch; }

  /* ---- Grid: a recessed panel with silicone-style pads ---- */
  #grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: var(--gap);
    touch-action: manipulation; padding: 6px; border-radius: 14px;
    background: #0b0b0b; border: 1px solid #222;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.03);
  }
  .pad {
    aspect-ratio: 1; border-radius: 6px; border: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 600; cursor: pointer; position: relative;
    background-image: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0) 55%);
    transition: background-color .22s var(--ease), color .22s var(--ease), box-shadow .3s var(--ease), transform .12s var(--spring);
  }
  .pad:active { transform: scale(.9); transition-duration: .22s, .22s, .3s, .05s; }
  .pad.in   { background-color: var(--pad-in);   color: var(--pad-in-text); }
  .pad.root { background-color: var(--root);     color: #fff; box-shadow: 0 0 10px var(--root-glow); }
  .pad.out  { background-color: var(--pad-out);  color: var(--pad-out-text); background-image: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0) 55%); }
  .pad.void { background-color: var(--pad-void); color: transparent; cursor: default; background-image: none; }
  /* Chord states sit on top of the base state. */
  .pad.ghost {
    background-color: #4b3518; background-color: color-mix(in srgb, var(--accent) 30%, #1a1a1a);
    color: rgba(255, 225, 190, .78); box-shadow: none;
  }
  .pad.ghost.bass { box-shadow: inset 0 0 0 2px rgba(255,255,255,.32); }
  .pad.chord {
    background-color: var(--accent); color: var(--accent-ink); font-size: 13.5px; font-weight: 700;
    box-shadow: 0 0 0 1px rgba(255, 200, 130, .5), 0 0 16px var(--accent-glow);
    background-image: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 60%);
  }
  .pad.chord.bass { box-shadow: inset 0 0 0 2.5px #fff, 0 0 0 1px rgba(255,255,255,.7), 0 0 20px var(--accent-glow); }
  .pad.shared::after {
    content: ''; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--accent-ink); box-shadow: 0 0 0 1.5px rgba(255,255,255,.55);
  }
  .labels-off .pad:not(.chord) .lbl { opacity: 0; }
  .pad .lbl { transition: opacity .2s; pointer-events: none; }

  /* ---- Readout: a small display ---- */
  .readout {
    position: relative; cursor: pointer; touch-action: pan-y; overflow: hidden;
    background: linear-gradient(180deg, #1b1b1b, #161616); border: 1px solid var(--line-soft); border-radius: 12px;
    padding: 7px 34px; text-align: center; min-height: 60px;
    display: flex; flex-direction: column; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
    transition: transform .15s var(--spring), border-color .25s;
  }
  .readout::after {
    content: ''; position: absolute; right: 13px; top: 50%; margin-top: -6px;
    border-left: 10px solid var(--faint); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    transition: border-left-color .2s;
  }
  .readout:active { transform: scale(.985); }
  .readout:active::after { border-left-color: var(--accent); }
  .readout .ro { display: flex; flex-direction: column; gap: 1px; }
  .readout .big { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .readout .big .num { color: var(--accent); }
  .readout .big .sep { color: var(--faint); font-weight: 400; }
  .readout .notes { font-size: 16px; font-weight: 600; letter-spacing: .04em; color: #cfcfcf; }
  .readout .src { color: var(--muted); font-size: 12.5px; font-weight: 500; letter-spacing: 0; }
  .readout .small { font-size: 12.5px; color: var(--muted); }
  .readout.warn .small { color: var(--warn); }

  .missing {
    display: flex; align-items: center; gap: 8px; margin-top: -2px;
    background: rgba(255, 90, 76, .1); border: 1px dashed rgba(255, 90, 76, .7); border-radius: var(--radius);
    padding: 3px 3px 3px 11px; color: #ffbdb6; font-size: 12.5px; line-height: 1.25;
    animation: rise .28s var(--ease);
  }
  .missing[hidden] { display: none; }
  .missing span { flex: 1; }
  .missing button {
    flex: none; border: 0; border-radius: 8px; background: var(--warn); color: #fff;
    font-weight: 700; padding: 8px 10px; cursor: pointer; font-size: 12.5px;
    transition: transform .15s var(--spring), filter .2s;
  }
  .missing button:active { transform: scale(.95); filter: brightness(1.1); }

  /* ---- Chord pickers ---- */
  .chord-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .chord-btn {
    border: 1px solid var(--line-soft); border-radius: 9px; background: var(--surface);
    padding: 5px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 1px;
    cursor: pointer; min-width: 0; position: relative;
    transition: background-color .2s var(--ease), border-color .2s, color .2s, box-shadow .3s var(--ease), transform .15s var(--spring);
  }
  .chord-btn:active { transform: scale(.94); }
  .chord-btn .n { font-size: 11.5px; font-weight: 600; color: var(--muted); transition: color .2s; }
  .chord-btn .c { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%; }
  .chord-btn[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    box-shadow: 0 0 14px rgba(255, 164, 58, .35);
  }
  .chord-btn[aria-pressed="true"] .n { color: rgba(32, 19, 4, .75); }
  .borrowed-row {
    display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; align-items: stretch;
    margin: 0 -16px; padding: 0 16px; scroll-padding: 0 16px; scroll-snap-type: x proximity;
  }
  .borrowed-row::-webkit-scrollbar { display: none; }
  .borrowed-row .chord-btn {
    flex: none; min-width: 58px; padding: 5px 7px 6px; scroll-snap-align: start;
    border-style: dashed; border-color: #444; background: transparent;
  }
  .borrowed-row .chord-btn[aria-pressed="true"] { border-style: solid; background: var(--accent); border-color: var(--accent); }
  .borrowed-row .tag { align-self: center; flex: none; width: 36px; font-size: 8.5px; line-height: 1.15; text-align: center; color: var(--faint); }
  .chord-btn .w { position: absolute; top: 2px; right: 4px; font-size: 9px; color: var(--warn); }
  .chord-btn[aria-pressed="true"] .w { color: #8a1a10; }
  .pick-row { display: flex; gap: 6px; }
  .pick-row .seg { flex: 1; --thumb: var(--surface-3); --thumb-ink: var(--text); }
  .pick-row .seg button { padding: 9px 2px; font-size: 13.5px; }
  .inv-btn {
    flex: none; width: 76px; border: 1px solid var(--line-soft); border-radius: var(--radius); background: var(--surface);
    font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    transition: transform .15s var(--spring), background-color .2s;
  }
  .inv-btn:active { transform: scale(.94); background: var(--surface-2); }
  .inv-btn:disabled { opacity: .45; }
  .inv-btn small { font-size: 9px; }

  /* ---- Sheets (slide up) ---- */
  .backdrop {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(0,0,0,.6); opacity: 0; transition: opacity .25s var(--ease);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .backdrop[hidden] { display: none; }
  .backdrop.open { opacity: 1; }
  .sheet {
    width: 100%; max-width: 520px; background: var(--surface); border-radius: 18px 18px 0 0;
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .36s var(--ease);
    box-shadow: 0 -10px 40px rgba(0,0,0,.5);
  }
  .sheet::before { content: ''; align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--surface-3); flex: none; }
  .backdrop.open .sheet { transform: none; }
  .sheet h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field .seg { background: var(--surface-2); --thumb: var(--text); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 48px; height: 44px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--surface-2); font-size: 22px; cursor: pointer; transition: transform .15s var(--spring);
  }
  .stepper button:active { transform: scale(.9); }
  .stepper output { min-width: 110px; text-align: center; font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .volume { width: 100%; accent-color: var(--accent); height: 32px; }
  .done {
    border: 0; border-radius: var(--radius); background: var(--text); color: var(--bg);
    padding: 12px; font-weight: 700; cursor: pointer; transition: transform .15s var(--spring);
  }
  .done:active { transform: scale(.97); }
  .sheet-note { margin: 0; color: var(--muted); font-size: 12.5px; text-align: center; }

  /* ---- Tab bar (sliding thumb, like .seg) ---- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: rgba(20,20,20,.88); border-top: 1px solid var(--line-soft);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    padding: 6px 16px calc(env(safe-area-inset-bottom) + 6px);
  }
  .tabbar .seg { max-width: 488px; margin: 0 auto; background: transparent; border: 0; padding: 0; --thumb: var(--surface-3); --thumb-ink: var(--text); }
  .tabbar .seg::before { top: 0; bottom: 0; border-radius: var(--radius); }
  .tabbar button { padding: 11px 0; font-weight: 700; font-size: 14px; border-radius: var(--radius); }

  /* ---- Play-through ---- */
  .play { display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; }
  .play-head { display: flex; align-items: center; gap: 8px; }
  .play-head span { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .text-btn {
    border: 1px solid var(--line-soft); background: var(--surface); border-radius: 9px;
    padding: 7px 12px; font-weight: 600; cursor: pointer; transition: transform .15s var(--spring), background-color .2s;
  }
  .text-btn:active { transform: scale(.95); background: var(--surface-2); }
  .play-row { display: flex; gap: 6px; align-items: stretch; }
  .step-btn {
    flex: none; width: 56px; border: 1px solid var(--line-soft); border-radius: 12px;
    background: var(--surface); font-size: 22px; font-weight: 700; cursor: pointer;
    transition: transform .15s var(--spring), background-color .2s;
  }
  .step-btn:active { transform: scale(.9); background: var(--surface-2); }
  .step-btn:disabled { opacity: .35; }
  .strip { flex: 1; display: flex; gap: 4px; min-width: 0; }
  .strip .slot-chip {
    flex: 1; min-width: 0; border: 1px solid var(--line-soft); border-radius: 9px; background: var(--surface);
    padding: 8px 0; font-weight: 700; font-size: 13px; cursor: pointer; overflow: hidden; white-space: nowrap;
    transition: background-color .22s var(--ease), color .22s, box-shadow .3s, transform .15s var(--spring);
  }
  .strip .slot-chip:active { transform: scale(.92); }
  .strip .slot-chip[aria-current="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 14px rgba(255,164,58,.35);
  }
  .strip .empty { color: var(--muted); font-size: 13px; align-self: center; text-align: center; flex: 1; }

  /* ---- Progressions tab ---- */
  .prog { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
  .prog h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; flex: 1; }
  .prog h3 { margin: 10px 0 0; }
  .prog-head { display: flex; align-items: center; gap: 8px; }
  .prog-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .prog-item {
    display: flex; align-items: stretch; background: var(--surface);
    border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden;
    transition: transform .15s var(--spring), border-color .2s;
  }
  .prog-item:active { transform: scale(.985); }
  .prog-item .main {
    flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 11px 13px; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px;
  }
  .prog-item .main b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog-item .main small { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog-item .side {
    flex: none; width: 52px; border: 0; border-left: 1px solid var(--line-soft); background: transparent;
    font-size: 17px; cursor: pointer; color: var(--muted); transition: background-color .2s, color .2s;
  }
  .prog-item .side:active { background: var(--surface-2); color: var(--text); }
  .prog-item .side.play-it { color: var(--accent); }
  .prog-empty { color: var(--muted); text-align: center; padding: 18px 0; }

  .name-input {
    width: 100%; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 11px 13px; font-size: 18px; font-weight: 700; color: var(--text); outline: none;
    -webkit-user-select: text; user-select: text; transition: border-color .2s;
  }
  .name-input:focus { border-color: var(--accent); }
  .slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .slot { display: flex; gap: 4px; align-items: stretch; }
  .slot .idx { width: 18px; flex: none; color: var(--faint); font-size: 12px; font-weight: 600; align-self: center; text-align: right; font-variant-numeric: tabular-nums; }
  .slot .pick {
    flex: 1; min-width: 0; text-align: left; border: 1px solid var(--line-soft); background: var(--surface);
    border-radius: var(--radius); padding: 10px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 600; transition: transform .15s var(--spring), background-color .2s;
  }
  .slot .pick:active { transform: scale(.98); background: var(--surface-2); }
  .slot .pick.empty { color: var(--faint); border-style: dashed; border-color: #3a3a3a; background: transparent; font-weight: 500; }
  .slot .pick .num { color: var(--accent); font-weight: 700; }
  .slot .mini {
    flex: none; width: 40px; border: 1px solid var(--line-soft); background: var(--surface); border-radius: var(--radius);
    font-size: 14px; cursor: pointer; color: var(--muted); transition: transform .15s var(--spring), color .2s;
  }
  .slot .mini:active { transform: scale(.9); color: var(--text); }
  .slot .mini:disabled { opacity: .25; cursor: default; }

  .btn-row { display: flex; gap: 8px; }
  .btn-row > * { flex: 1; }
  .ghost-btn {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2);
    padding: 12px; font-weight: 700; cursor: pointer; transition: transform .15s var(--spring), filter .2s;
  }
  .ghost-btn:active { transform: scale(.96); }
  .ghost-btn:disabled { opacity: .4; }
  .ghost-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 0 14px rgba(255,164,58,.25); }
  .act-list { display: flex; flex-direction: column; gap: 8px; }
  .act-list .danger { color: var(--warn); }
  .pick-readout { text-align: center; font-size: 18px; font-weight: 700; min-height: 24px; }
  .pick-readout .num { color: var(--accent); }

  /* ---- Update toast ---- */
  .toast {
    position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 8px); z-index: 20;
    max-width: 488px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
    background: rgba(40,40,40,.95); border: 1px solid rgba(255,164,58,.6); border-radius: 12px; padding: 8px 8px 8px 13px;
    box-shadow: 0 10px 30px rgba(0,0,0,.55); font-size: 14px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    animation: drop .4s var(--ease);
  }
  .toast[hidden] { display: none; }
  .toast span { flex: 1; }
  .toast button { border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 9px 12px; cursor: pointer; }
  .toast .toast-x { background: transparent; color: var(--muted); padding: 9px 6px; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-20px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ---- Test harness ---- */
  .tests { padding: 16px; max-width: 760px; margin: 0 auto; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .tests h1 { font-family: var(--font); font-size: 20px; }
  .tests .pass { color: var(--ok); }
  .tests .fail { color: var(--warn); }
  .tests li { margin: 4px 0; }
  .tests pre { white-space: pre-wrap; color: var(--muted); margin: 2px 0 0 18px; }
</style>
</head>
<body>
<div id="app" hidden>
  <div id="stage" class="stack">
    <header class="bar">
      <div class="bar-row">
        <label class="sel"><span>Key</span><select id="key" aria-label="Key"></select></label>
        <label class="sel grow"><span id="scaleCaption">Scale</span><select id="scale" aria-label="Scale"></select></label>
        <button id="gear" class="icon-btn" aria-label="More settings">⚙</button>
      </div>
      <div class="bar-row">
        <div class="seg mode" role="radiogroup" aria-label="Mode">
          <button role="radio" data-set="mode" data-val="inKey">In Key</button>
          <button role="radio" data-set="mode" data-val="chromatic">Chromatic</button>
        </div>
        <button id="summary" class="summary" aria-label="Layout settings"></button>
      </div>
    </header>
    <div id="notice" class="notice" hidden></div>
    <main id="grid" aria-label="Pad grid"></main>
    <section id="readout" class="readout" aria-live="polite" role="button" tabindex="0" aria-label="Play chord"></section>
    <div id="missing" class="missing" role="alert" hidden>
      <span id="missingText"></span>
      <button id="toChromatic">Show in Chromatic</button>
    </div>

    <div id="refControls" class="stack">
      <div id="diatonic" class="chord-row" aria-label="Diatonic chords"></div>
      <div id="borrowed" class="borrowed-row" aria-label="Borrowed chords"></div>
      <div class="pick-row">
        <div id="types" class="seg" role="radiogroup" aria-label="Chord type"></div>
        <button id="inversion" class="inv-btn" aria-label="Inversion"></button>
      </div>
    </div>

    <div id="playControls" class="play" hidden>
      <div class="play-head">
        <span id="playName"></span>
        <button id="playEdit" class="text-btn">Edit</button>
        <button id="playExit" class="text-btn" aria-label="Stop playing">✕</button>
      </div>
      <div class="play-row">
        <button id="prev" class="step-btn" aria-label="Previous chord">←</button>
        <div id="strip" class="strip"></div>

      </div>
    </div>
  </div>

  <section id="progView" class="prog" hidden></section>

  <nav class="tabbar">
    <div class="seg" role="tablist">
      <button role="tab" data-tab="reference">Reference</button>
      <button role="tab" data-tab="progressions">Progressions</button>
    </div>
  </nav>
</div>

<div id="sheet" class="backdrop" hidden>
  <div class="sheet" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="field"><span>Layout</span>
      <div class="seg" role="radiogroup">
        <button role="radio" data-set="layout" data-val="4ths">4ths</button>
        <button role="radio" data-set="layout" data-val="3rds">3rds</button>
        <button role="radio" data-set="layout" data-val="sequential">Sequential</button>
      </div>
    </div>
    <div class="field"><span>Orientation</span>
      <div class="seg" role="radiogroup">
        <button role="radio" data-set="orientation" data-val="rows">Rows ▲</button>
        <button role="radio" data-set="orientation" data-val="columns">Columns ▶</button>
      </div>
    </div>
    <div class="field"><span>Fixed</span>
      <div class="seg" role="radiogroup">
        <button role="radio" data-set="fixed" data-val="false">Off – root at bottom left</button>
        <button role="radio" data-set="fixed" data-val="true">On – C</button>
      </div>
    </div>
    <div class="field"><span>Octave (bottom-left pad)</span>
      <div class="stepper">
        <button id="octDown" aria-label="Octave down">−</button>
        <output id="octOut"></output>
        <button id="octUp" aria-label="Octave up">+</button>
      </div>
    </div>
    <div class="field"><span>Note names on pads</span>
      <div class="seg" role="radiogroup">
        <button role="radio" data-set="labels" data-val="all">All pads</button>
        <button role="radio" data-set="labels" data-val="chord">Chord notes only</button>

  <button id="updateLater" class="toast-x" aria-label="Not now">✕</button>
</div>

<div id="tests" class="tests" hidden></div>

<script>
'use strict';

/* =====================================================================
   MUSIC LOGIC – pure functions, no DOM access.
   Pad (r, c): r = 0 is the bottom row, c = 0 is the left column.
   MIDI octave naming follows Ableton: C3 = MIDI 60.
   ===================================================================== */
const Music = (() => {
  const SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const FLAT  = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

  // Same order as the Push key page (circle of fifths, sharps then flats).
  const KEYS = [
    ['C',0],['G',7],['D',2],['A',9],['E',4],['B',11],
    ['F',5],['B♭',10],['E♭',3],['A♭',8],['D♭',1],['G♭',6],
  ].map(([name, pc]) => ({ name, pc }));

  // relMajor: semitones from the tonic up to the major key that shares the
  // scale's key signature. Used only to choose sharps or flats.
  const SCALES = [
    { name: 'Major',             intervals: [0,2,4,5,7,9,11], relMajor: 0 },
    { name: 'Minor',             intervals: [0,2,3,5,7,8,10], relMajor: 3 },
    { name: 'Dorian',            intervals: [0,2,3,5,7,9,10], relMajor: 10 },
    { name: 'Mixolydian',        intervals: [0,2,4,5,7,9,10], relMajor: 5 },
    { name: 'Lydian',            intervals: [0,2,4,6,7,9,11], relMajor: 7 },
    { name: 'Phrygian',          intervals: [0,1,3,5,7,8,10], relMajor: 8 },
    { name: 'Locrian',           intervals: [0,1,3,5,6,8,10], relMajor: 1 },
    { name: 'Harmonic Minor',    intervals: [0,2,3,5,7,8,11], relMajor: 3 },
    { name: 'Melodic Minor',     intervals: [0,2,3,5,7,9,11], relMajor: 3 },
    { name: 'Harmonic Major',    intervals: [0,2,4,5,7,8,11], relMajor: 0 },
    { name: 'Phrygian Dominant', intervals: [0,1,4,5,7,8,10], relMajor: 8 },
  ];

  // Row offset per layout: scale degrees for In Key, semitones for Chromatic.
  // The step along the main axis is always 1.
  const LAYOUTS = {
    '4ths':       { label: '4ths',       inKey: 3, chromatic: 5 },
    '3rds':       { label: '3rds',       inKey: 2, chromatic: 4 },
    'sequential': { label: 'Sequential', inKey: 8, chromatic: 8 },
  };

  const FLAT_SIDE = new Set([5, 10, 3, 8, 1, 6]); // F B♭ E♭ A♭ D♭ G♭

  const DEFAULT_SETTINGS = Object.freeze({
    key: 'C', scale: 'Major', mode: 'inKey', layout: '4ths',
    orientation: 'rows', fixed: false, octave: 3,
    strum: true, volume: 0.7, labels: 'all',
  });
  const OCTAVE_MIN = -2, OCTAVE_MAX = 7;

  const mod = (n, m) => ((n % m) + m) % m;
  const keyByName = name => KEYS.find(k => k.name === name);
  const scaleByName = name => SCALES.find(s => s.name === name);

  /** Fill in defaults and drop anything invalid (e.g. from old storage). */
  function normaliseSettings(raw) {
    const s = { ...DEFAULT_SETTINGS };
    if (!raw || typeof raw !== 'object') return s;
    if (keyByName(raw.key)) s.key = raw.key;
    if (scaleByName(raw.scale)) s.scale = raw.scale;
    if (raw.mode === 'inKey' || raw.mode === 'chromatic') s.mode = raw.mode;
    if (LAYOUTS[raw.layout]) s.layout = raw.layout;
    if (raw.orientation === 'rows' || raw.orientation === 'columns') s.orientation = raw.orientation;
    if (typeof raw.fixed === 'boolean') s.fixed = raw.fixed;
    if (Number.isInteger(raw.octave)) s.octave = Math.min(OCTAVE_MAX, Math.max(OCTAVE_MIN, raw.octave));
    if (typeof raw.strum === 'boolean') s.strum = raw.strum;
    if (typeof raw.volume === 'number' && raw.volume >= 0 && raw.volume <= 1) s.volume = raw.volume;
    if (raw.labels === 'all' || raw.labels === 'chord') s.labels = raw.labels;
    return s;
  }

  /** Sharps or flats for this key and scale, based on its key signature. */
  function usesFlats(keyName, scaleName) {
    const k = keyByName(keyName), sc = scaleByName(scaleName);
    return FLAT_SIDE.has(mod(k.pc + sc.relMajor, 12));
  }

  function noteName(pc, flats) { return (flats ? FLAT : SHARP)[mod(pc, 12)]; }
  function midiOctave(midi) { return Math.floor(midi / 12) - 2; }
  function midiName(midi, flats) { return noteName(midi, flats) + midiOctave(midi); }

  /** Pitch classes of the scale, starting on the key root. */
  function scaleNotes(keyName, scaleName) {
    const k = keyByName(keyName), sc = scaleByName(scaleName);
    return sc.intervals.map(i => mod(k.pc + i, 12));
  }

  /** MIDI note of scale degree index d (0 = tonic; any integer, wraps octaves). */
  function degreePitch(d, tonicMidi, intervals) {
    const n = intervals.length, oct = Math.floor(d / n);
    return tonicMidi + intervals[d - oct * n] + 12 * oct;
  }

  /**
   * Where the grid starts.
   * Chromatic: baseMidi is the bottom-left pitch.
   * In Key: startDegree is the scale-degree index of the bottom-left pad.
   * Fixed On in In Key: bottom-left is the lowest scale note at or above C
   * (assumption – to be checked on the hardware).
   */
  function gridOrigin(s) {
    const k = keyByName(s.key), sc = scaleByName(s.scale);
    const cMidi = 12 * (s.octave + 2);
    const tonicMidi = cMidi + k.pc;
    if (s.mode === 'chromatic') {
      return { tonicMidi, intervals: sc.intervals, baseMidi: s.fixed ? cMidi : tonicMidi, startDegree: null };
    }
    let startDegree = 0;
    if (s.fixed) {
      startDegree = -sc.intervals.length;
      while (degreePitch(startDegree, tonicMidi, sc.intervals) < cMidi) startDegree++;
    }
    return { tonicMidi, intervals: sc.intervals, baseMidi: degreePitch(startDegree, tonicMidi, sc.intervals), startDegree };
  }

  function rowOffset(s) { return LAYOUTS[s.layout][s.mode]; }

  /** Linear pad index: one step along the main axis, rowOffset across it. */
  function padIndex(r, c, s) {
    const row = rowOffset(s);
    return s.orientation === 'rows' ? r * row + c : c * row + r;
  }

  function padPitchFrom(origin, r, c, s) {
    const i = padIndex(r, c, s);
    return s.mode === 'chromatic'
      ? origin.baseMidi + i
      : degreePitch(origin.startDegree + i, origin.tonicMidi, origin.intervals);
  }

  /** MIDI note of pad (r, c). */
  function padPitch(r, c, s) { return padPitchFrom(gridOrigin(s), r, c, s); }

  /**
   * All 64 pads, index r*8 + c (bottom row first).
   * state: 'root' | 'in' | 'out' (Chromatic only) | 'void' (outside MIDI 0–127)
   */
  function buildGrid(s) {
    const origin = gridOrigin(s);
    const k = keyByName(s.key), sc = scaleByName(s.scale);
    const flats = usesFlats(s.key, s.scale);
    const pads = [];
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const midi = padPitchFrom(origin, r, c, s);
        const pc = mod(midi, 12);
        const degIdx = sc.intervals.indexOf(mod(pc - k.pc, 12));
        const inScale = degIdx !== -1;
        const valid = midi >= 0 && midi <= 127;
        const isRoot = pc === k.pc;
        pads.push({
          r, c, midi, pc, valid, inScale, isRoot,
          degree: inScale ? degIdx + 1 : null,
          name: noteName(pc, flats),
          fullName: midiName(midi, flats),
          state: !valid ? 'void' : isRoot ? 'root' : inScale ? 'in' : 'out',
        });
      }
    }
    return pads;
  }

  /** Notice text for scales the In Key shapes don't suit, or null. */
  function scaleNotice(s) {
    return s.mode === 'inKey' && scaleByName(s.scale).intervals.length !== 7
      ? 'Shapes vary in scales with other than 7 notes.'
      : null;
  }

  /* ------------------------------------------------------------------
     CHORDS
     Chord: { source: 'diatonic'|'borrowed', sourceMode, degree: 1–7,
              type, inversion }
     ------------------------------------------------------------------ */
  const MAJOR = [0,2,4,5,7,9,11];
  const ROMAN = ['I','II','III','IV','V','VI','VII'];

  const CHORD_TYPES = [
    { id: 'triad', label: 'Triad', offsets: [0,2,4] },
    { id: '7',     label: '7',     offsets: [0,2,4,6] },
    { id: 'sus2',  label: 'sus2',  offsets: [0,1,4] },
    { id: 'sus4',  label: 'sus4',  offsets: [0,3,4] },
    { id: 'add9',  label: 'add9',  offsets: [0,2,4,8] },
    { id: '6',     label: '6',     offsets: [0,2,4,5] },
  ];
  const typeById = id => CHORD_TYPES.find(t => t.id === id);

  // Keyed by the semitones above the chord root (mod 12, sorted).
  // name: chord-symbol suffix; num: numeral suffix; minor: lower-case numeral.
  const QUALITIES = {
    '0,4,7':    { name: '',       num: '' },
    '0,3,7':    { name: 'm',      num: '',      minor: true },
    '0,3,6':    { name: 'dim',    num: '°',     minor: true },
    '0,4,8':    { name: 'aug',    num: '+' },
    '0,4,7,11': { name: 'maj7',   num: 'maj7' },
    '0,4,7,10': { name: '7',      num: '7' },
    '0,3,7,10': { name: 'm7',     num: '7',     minor: true },
    '0,3,6,10': { name: 'm7♭5',   num: 'ø7',    minor: true },
    '0,3,6,9':  { name: 'dim7',   num: '°7',    minor: true },
    '0,3,7,11': { name: 'mMaj7',  num: 'maj7',  minor: true },
    '0,4,8,11': { name: 'maj7♯5', num: '+maj7' },
    '0,4,8,10': { name: '7♯5',    num: '+7' },
    '0,4,6,10': { name: '7♭5',    num: '7♭5' },
    '0,2,7':    { name: 'sus2',   num: 'sus2' },
    '0,5,7':    { name: 'sus4',   num: 'sus4' },
    '0,2,4,7':  { name: 'add9',   num: 'add9' },
    '0,2,3,7':  { name: 'madd9',  num: 'add9',  minor: true },
    '0,4,7,9':  { name: '6',      num: '6' },
    '0,3,7,9':  { name: 'm6',     num: '6',     minor: true },
  };
  // Fallback labels for unusual stacks, e.g. sus4 on vii in Major → B(4,♭5).
  const INTERVAL_LABELS = ['1','♭2','2','♭3','3','4','♭5','5','♭6','6','♭7','7'];
  const BLACK_KEYS = new Set([1,3,6,8,10]);

  function chordSize(chord) { return typeById(chord.type).offsets.length; }

  /** Fill in defaults and clamp the inversion to the chord size. */
  function normaliseChord(raw) {
    const c = { source: 'diatonic', sourceMode: null, degree: 1, type: 'triad', inversion: 0 };
    if (!raw || typeof raw !== 'object') return c;
    if (raw.source === 'borrowed' && scaleByName(raw.sourceMode)) { c.source = 'borrowed'; c.sourceMode = raw.sourceMode; }
    if (Number.isInteger(raw.degree) && raw.degree >= 1 && raw.degree <= 7) c.degree = raw.degree;
    if (typeById(raw.type)) c.type = raw.type;
    if (Number.isInteger(raw.inversion) && raw.inversion >= 0 && raw.inversion < chordSize(c)) c.inversion = raw.inversion;
    return c;
  }

  function sourceScale(chord, s) {
    return scaleByName(chord.source === 'diatonic' ? s.scale : chord.sourceMode);
  }

  /** Root-position stack in semitones above the key root (the source mode's intervals). */
  function rootPositionSemis(chord, s) {
    const iv = sourceScale(chord, s).intervals;
    return typeById(chord.type).offsets.map(o => degreePitch(chord.degree - 1 + o, 0, iv));
  }

  /**
   * Voicing in ascending order, as semitones above C (so p % 12 is the pitch class).
   * Inversion n puts the nth chord tone in the bass and lifts every note below
   * it up by octaves until it sits above the bass. For ordinary chords this is
   * the same as moving the lowest n notes up an octave.
   */
  function chordPitches(chord, s) {
    const k = keyByName(s.key);
    const rp = rootPositionSemis(chord, s).map(x => x + k.pc);
    const bass = rp[chord.inversion];
    return rp.map((p, i) => {
      if (i === chord.inversion) return p;
      while (p <= bass) p += 12;
      return p;
    }).sort((a, b) => a - b);
  }

  function chordQuality(chord, s) {
    const rp = rootPositionSemis(chord, s);
    const ivs = [...new Set(rp.map(x => mod(x - rp[0], 12)))].sort((a, b) => a - b);
    const q = QUALITIES[ivs.join(',')];
    if (q) return { name: q.name, num: q.num, minor: !!q.minor, known: true };
    return {
      name: '(' + ivs.slice(1).map(i => INTERVAL_LABELS[i]).join(',') + ')',
      num: '', minor: ivs.includes(3) && !ivs.includes(4), known: false,
    };
  }

  /** −1 for ♭, +1 for ♯: the chord root against the same degree of the key's major scale. */
  function numeralAccidental(chord, s) {
    const root = rootPositionSemis(chord, s)[0];
    return mod(root - MAJOR[chord.degree - 1] + 6, 12) - 6;
  }

  function romanNumeral(chord, s) {
    const q = chordQuality(chord, s), acc = numeralAccidental(chord, s);
    const base = ROMAN[chord.degree - 1];
    const pre = acc < 0 ? '♭'.repeat(-acc) : '♯'.repeat(acc);
    return pre + (q.minor ? base.toLowerCase() : base) + q.num;
  }

  /**
   * Flats if the chord's source mode is on the flat side in this key (so
   * borrowed iv in C is F A♭ C), and for black-key roots with a ♭ numeral.
   */
  function chordSpellsFlat(chord, s) {
    if (usesFlats(s.key, sourceScale(chord, s).name)) return true;
    const rootPc = mod(keyByName(s.key).pc + rootPositionSemis(chord, s)[0], 12);
    return numeralAccidental(chord, s) < 0 && BLACK_KEYS.has(rootPc);
  }

  function chordName(chord, s) {
    const f = chordSpellsFlat(chord, s);
    const rootPc = keyByName(s.key).pc + rootPositionSemis(chord, s)[0];
    const slash = chord.inversion ? '/' + noteName(chordPitches(chord, s)[0], f) : '';
    return noteName(rootPc, f) + chordQuality(chord, s).name + slash;
  }

  /** Note names in voicing order, bass first. */
  function chordNoteNames(chord, s) {
    const f = chordSpellsFlat(chord, s);
    return chordPitches(chord, s).map(p => noteName(p, f));
  }

  /**
   * Find the chord shape on the grid.
   * pitches: ascending, as from chordPitches (only the intervals and the
   *   bass pitch class matter).
   * grid: from buildGrid. anchor: optional pad index (r*8 + c) for the bass.
   * Bass candidates are every pad with the bass pitch class, lowest pitch
   * first, then nearest the bottom left. Each further note takes the pad with
   * that exact pitch closest to the bass (Manhattan), ties to the lower row,
   * then the left. Returns { primary, others, anchorMissed }, where a shape is
   * { bass, pads } (pad indices, voicing order).
   */
  function placeShape(pitches, grid, anchor = null) {
    const bassPc = mod(pitches[0], 12);
    const rel = pitches.map(p => p - pitches[0]);
    const idx = p => p.r * 8 + p.c;
    const basses = grid
      .filter(p => p.valid && p.pc === bassPc)
      .sort((a, b) => a.midi - b.midi || (a.r + a.c) - (b.r + b.c) || a.r - b.r);

    const fit = b => {
      const pads = [idx(b)];
      for (let i = 1; i < rel.length; i++) {
        const target = b.midi + rel[i];
        let best = null, bestD = Infinity;
        for (const p of grid) {
          if (!p.valid || p.midi !== target) continue;
          const d = Math.abs(p.r - b.r) + Math.abs(p.c - b.c);
          if (d < bestD || (d === bestD && (p.r < best.r || (p.r === best.r && p.c < best.c)))) {
            best = p; bestD = d;
          }
        }
        if (!best) return null;
        pads.push(idx(best));
      }
      return { bass: pads[0], pads };
    };

    const shapes = basses.map(fit).filter(Boolean);
    let primary = anchor == null ? null : shapes.find(sh => sh.bass === anchor) || null;
    const anchorMissed = anchor != null && !primary;
    if (!primary) primary = shapes[0] || null;
    return { primary, others: shapes.filter(sh => sh !== primary), anchorMissed };
  }

  /* ------------------------------------------------------------------
     BORROWED CHORDS
     The family comes from the current scale's 3rd. Numerals in the
     comments are for triads; the app works them out from the notes.
     ------------------------------------------------------------------ */
  const BORROWED = {
    major: [
      ['Minor', 4],        // iv
      ['Minor', 3],        // ♭III
      ['Minor', 6],        // ♭VI
      ['Minor', 7],        // ♭VII
      ['Minor', 5],        // v
      ['Minor', 2],        // ii°
      ['Phrygian', 2],     // ♭II
      ['Lydian', 2],       // II
    ],
    minor: [
      ['Dorian', 4],          // IV
      ['Harmonic Minor', 5],  // V
      ['Major', 1],           // I
      ['Dorian', 2],          // ii (the spec says II, but Dorian's 2nd degree is minor)
      ['Phrygian', 2],        // ♭II
      ['Melodic Minor', 6],   // vi°
    ],
  };

  function scaleFamily(scaleName) {
    return scaleByName(scaleName).intervals.includes(4) ? 'major' : 'minor';
  }

  /** (sourceMode, degree) pairs for the scale's family. */
  function borrowedFor(scaleName) {
    return BORROWED[scaleFamily(scaleName)].map(([sourceMode, degree]) => ({ sourceMode, degree }));
  }

  function pcSetKey(chord, s) {
    return [...new Set(chordPitches(chord, s).map(p => mod(p, 12)))].sort((a, b) => a - b).join(',');
  }

  /**
   * Borrowed chords of the given type for these settings, leaving out any
   * with the same notes as a diatonic chord (e.g. ♭VII in Mixolydian).
   */
  function borrowedChords(s, type) {
    const diatonic = new Set([1,2,3,4,5,6,7].map(d => pcSetKey(normaliseChord({ degree: d, type }), s)));
    return borrowedFor(s.scale)
      .map(b => normaliseChord({ source: 'borrowed', sourceMode: b.sourceMode, degree: b.degree, type }))
      .filter(ch => !diatonic.has(pcSetKey(ch, s)));
  }

  /** Chord notes whose pitch class isn't in the current scale: [{ pc, name }]. */
  function missingNotes(chord, s) {
    const inScale = new Set(scaleNotes(s.key, s.scale));
    const f = chordSpellsFlat(chord, s);
    const seen = new Set(), out = [];
    for (const p of chordPitches(chord, s)) {
      const pc = mod(p, 12);
      if (!inScale.has(pc) && !seen.has(pc)) { seen.add(pc); out.push({ pc, name: noteName(pc, f) }); }
    }
    return out;
  }

  function missingMessage(missing) {
    const n = missing.length;
    return `Switch Push to Chromatic – ${n} note${n === 1 ? '' : 's'} not in scale (${missing.map(m => m.name).join(', ')})`;
  }

  /**
   * Place a chord for the current mode. In In Key, notes outside the scale
   * have no pad, so only the playable notes are placed (relative to the
   * lowest playable one) and the rest are listed in `missing`.
   * anchorPc: the pitch class a tap must have to re-anchor the shape.
   */
  function placeChord(chord, s, grid, anchor = null) {
    const pitches = chordPitches(chord, s);
    const missing = s.mode === 'inKey' ? missingNotes(chord, s) : [];
    const gone = new Set(missing.map(m => m.pc));
    const playable = pitches.filter(p => !gone.has(mod(p, 12)));
    if (!playable.length) return { primary: null, others: [], anchorMissed: false, missing, bassMissing: true, anchorPc: null };
    return {
      ...placeShape(playable, grid, anchor),
      missing,
      bassMissing: playable[0] !== pitches[0],
      anchorPc: mod(playable[0], 12),
    };
  }

  /**
   * MIDI notes to sound for a chord: the full chord (missing notes included),
   * at the octave of the lit shape. With no shape on the grid, the bass goes
   * in the settings octave.
   */
  function chordMidi(chord, s, placement, grid) {
    const pitches = chordPitches(chord, s);
    if (placement && placement.primary) {
      const gone = new Set(placement.missing.map(m => m.pc));
      const lowestPlayable = pitches.find(p => !gone.has(mod(p, 12)));
      const offset = grid[placement.primary.pads[0]].midi - lowestPlayable;
      return pitches.map(p => p + offset);
    }
    const offset = 12 * (s.octave + 2) - 12 * Math.floor(pitches[0] / 12);
    return pitches.map(p => p + offset);
  }

  /* ------------------------------------------------------------------
     PROGRESSIONS
     Chords are stored as degrees, so changing the key transposes them.
     ------------------------------------------------------------------ */
  const SLOT_COUNT = 8;
  const dia = degree => ({ source: 'diatonic', degree, type: 'triad', inversion: 0 });
  const PRESETS = [
    { name: 'I–V–vi–IV',        scale: 'Major', chords: [dia(1), dia(5), dia(6), dia(4)] },
    { name: 'ii–V–I',           scale: 'Major', chords: [dia(2), dia(5), dia(1)] },
    { name: 'i–♭VI–♭III–♭VII',  scale: 'Minor', chords: [dia(1), dia(6), dia(3), dia(7)] },
    { name: 'i–iv–v',           scale: 'Minor', chords: [dia(1), dia(4), dia(5)] },
    { name: 'I–♭VII–IV',        scale: 'Major', chords: [dia(1), { source: 'borrowed', sourceMode: 'Minor', degree: 7, type: 'triad', inversion: 0 }, dia(4)] },
  ];

  /** Validate a stored or imported progression; null if it can't be used. */
  function normaliseProgression(raw) {
    if (!raw || typeof raw !== 'object' || typeof raw.id !== 'string' || !raw.id) return null;
    const slots = Array.from({ length: SLOT_COUNT }, (_, i) => {
      const c = Array.isArray(raw.slots) ? raw.slots[i] : null;
      return c && typeof c === 'object' ? normaliseChord(c) : null;
    });
    return {
      id: raw.id,
      name: typeof raw.name === 'string' && raw.name.trim() ? raw.name.trim().slice(0, 60) : 'Untitled',
      key: keyByName(raw.key) ? raw.key : DEFAULT_SETTINGS.key,
      scale: scaleByName(raw.scale) ? raw.scale : DEFAULT_SETTINGS.scale,
      slots,
      updatedAt: Number.isFinite(raw.updatedAt) ? raw.updatedAt : 0,
    };
  }

  function makeProgression({ id, name, key, scale, chords = [], now = 0 }) {
    return normaliseProgression({ id, name, key, scale, slots: chords, updatedAt: now });
  }

  function presetProgression(preset, key, id, now = 0) {
    return makeProgression({ id, name: preset.name, key, scale: preset.scale, chords: preset.chords, now });
  }

  /** The app settings with the progression's key and scale. */
  function progressionSettings(prog, s) { return { ...s, key: prog.key, scale: prog.scale }; }

  function progressionSummary(prog) {
    const s = progressionSettings(prog, DEFAULT_SETTINGS);
    const nums = prog.slots.filter(Boolean).map(c => romanNumeral(c, s));
    return nums.length ? nums.join('–') : 'Empty';
  }

  function progressionChordNames(prog) {
    const s = progressionSettings(prog, DEFAULT_SETTINGS);
    return prog.slots.filter(Boolean).map(c => chordName(c, s));
  }

  /** Move one slot to a new position; out-of-range moves change nothing. */
  function moveSlot(slots, from, to) {
    const out = slots.slice();
    if (to < 0 || to >= slots.length || from === to) return out;
    const [x] = out.splice(from, 1);
    out.splice(to, 0, x);
    return out;
  }

  /** Next filled slot in direction dir (±1), wrapping; −1 if all are empty. */
  function stepIndex(prog, index, dir) {
    const n = prog.slots.length;
    for (let k = 1; k <= n; k++) {
      const i = mod(index + dir * k, n);
      if (prog.slots[i]) return i;
    }
    return -1;
  }

  /** Pitch classes two chords have in common. */
  function sharedPcs(a, b, s) {
    const inA = new Set(chordPitches(a, s).map(p => mod(p, 12)));
    return new Set(chordPitches(b, s).map(p => mod(p, 12)).filter(pc => inA.has(pc)));
  }

  /** Read a backup file's text: an array, or { progressions: [...] }. */
  function parseBackup(text) {
    const data = JSON.parse(text);
    const list = Array.isArray(data) ? data : data && data.progressions;
    if (!Array.isArray(list)) throw new Error('This file isn’t a Pad Shapes backup.');
    return list.map(normaliseProgression).filter(Boolean);
  }

  /** Imported progressions replace ones with the same id; the rest are added. */
  function mergeProgressions(existing, incoming) {
    const out = existing.slice();
    for (const p of incoming) {
      const i = out.findIndex(q => q.id === p.id);
      if (i === -1) out.push(p); else out[i] = p;
    }
    return out;
  }

  return {
    SLOT_COUNT, PRESETS, normaliseProgression, makeProgression, presetProgression, progressionSettings,
    progressionSummary, progressionChordNames, moveSlot, stepIndex, sharedPcs, parseBackup, mergeProgressions,
    chordMidi,
    BORROWED, scaleFamily, borrowedFor, borrowedChords, missingNotes, missingMessage, placeChord,
    KEYS, SCALES, LAYOUTS, DEFAULT_SETTINGS, OCTAVE_MIN, OCTAVE_MAX, CHORD_TYPES,
    keyByName, scaleByName, normaliseSettings, usesFlats, noteName, midiName, midiOctave,
    scaleNotes, degreePitch, gridOrigin, rowOffset, padIndex, padPitch, buildGrid, scaleNotice,
    normaliseChord, chordSize, chordPitches, chordQuality, romanNumeral, chordName,
    chordNoteNames, chordSpellsFlat, placeShape,
  };
})();

/* =====================================================================
   STORAGE – localStorage behind try/catch (private mode, blocked storage).
   ===================================================================== */
const Store = (() => {
  const KEYS = { settings: 'padshapes.settings.v1', progressions: 'padshapes.progressions.v1' };
  function read(name, fallback) {
    try {
      const raw = localStorage.getItem(KEYS[name]);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function write(name, value) {
    try { localStorage.setItem(KEYS[name], JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
  return { read, write, KEYS };
})();

/* =====================================================================
   TESTS – open index.html?test
   ===================================================================== */
/* =====================================================================
   SYNTH – Web Audio. Two detuned saws into a lowpass, ADSR per voice:
   A 5 ms, D 300 ms, S 0.6, R 600 ms. The AudioContext is created on the
   first user gesture (browsers block audio until then).
   ===================================================================== */
const Synth = (() => {
  const A = 0.005, D = 0.3, S = 0.6, R = 0.6;
  const PEAK = 0.22, DETUNE_CENTS = 7, CUTOFF_HZ = 2600;
  let ctx = null, master = null, volume = 0.7;
  const live = new Set();

  const level = v => v * v;   // a gentler curve for the slider
  const freq = midi => 440 * Math.pow(2, (midi - 69) / 12);

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      // iOS 17+: play even with the ring/silent switch on silent.
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      ctx = new AC({ latencyHint: 'interactive' });
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.ratio.value = 4;
      master = ctx.createGain();
      master.gain.value = level(volume);
      master.connect(comp).connect(ctx.destination);
    }
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    return ctx;
  }

  /** Call from a user gesture. Plays a silent buffer, which older iOS needs. */
  function unlock() {
    const c = ensure();
    if (!c) return;
    const src = c.createBufferSource();
    src.buffer = c.createBuffer(1, 1, 22050);
    src.connect(c.destination);
    src.start(0);
  }

  // Envelope level at time t, for browsers without cancelAndHoldAtTime.
  function levelAt(v, t) {
    const dt = t - v.start;
    if (dt <= A) return PEAK * Math.max(0, dt) / A;
    return PEAK * S + PEAK * (1 - S) * Math.exp(-(dt - A) / (D / 3));
  }

  function noteOn(midi, delay = 0) {
    const c = ensure();
    if (!c) return null;
    const t = c.currentTime + delay;
    const env = c.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(PEAK, t + A);
    env.gain.setTargetAtTime(PEAK * S, t + A, D / 3);
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = CUTOFF_HZ; filter.Q.value = 0.7;
    const oscs = [-DETUNE_CENTS, DETUNE_CENTS].map(cents => {
      const o = c.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = freq(midi); o.detune.value = cents;
      o.connect(filter); o.start(t);
      return o;
    });
    filter.connect(env).connect(master);
    const v = { env, oscs, start: t, released: false };
    live.add(v);
    oscs[0].onended = () => { env.disconnect(); live.delete(v); };
    return v;
  }

  function noteOff(v, delay = 0) {
    if (!v || v.released || !ctx) return;
    v.released = true;
    const t = Math.max(ctx.currentTime + delay, v.start + A);
    const g = v.env.gain;
    if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t);
    else { g.cancelScheduledValues(t); g.setValueAtTime(levelAt(v, t), t); }
    g.setTargetAtTime(0, t, R / 4);
    v.oscs.forEach(o => o.stop(t + R + 0.1));
  }

  /** Play notes bass first, optionally strummed ~15 ms apart, held for `hold` seconds. */
  function playChord(midis, { strum = true, hold = 1.0 } = {}) {
    midis.forEach((m, i) => {
      const at = strum ? i * 0.015 : 0;
      noteOff(noteOn(m, at), at + hold);
    });
  }

  function setVolume(v) {
    volume = v;
    if (master) master.gain.setTargetAtTime(level(v), ctx.currentTime, 0.02);
  }

  return { unlock, noteOn, noteOff, playChord, setVolume, get voices() { return live.size; }, get state() { return ctx ? ctx.state : 'none'; } };
})();

function runTests() {
  const M = Music;
  const results = [];
  const S = over => M.normaliseSettings({ ...M.DEFAULT_SETTINGS, ...over });
  const at = (grid, r, c) => grid[r * 8 + c];
  const row = (grid, r) => grid.slice(r * 8, r * 8 + 8);
  const eq = (actual, expected, what) => {
    const a = JSON.stringify(actual), e = JSON.stringify(expected);
    if (a !== e) throw new Error(`${what}\n  expected ${e}\n  got      ${a}`);
  };
  const test = (name, fn) => {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, msg: e.message }); }
  };

  // ---- Acceptance tests for stage 1 ----
  test('AT1 C Major · In Key · 4ths · Rows: bottom row C D E F G A B C, row 2 starts on F', () => {
    const g = M.buildGrid(S({}));
    eq(row(g, 0).map(p => p.name), ['C','D','E','F','G','A','B','C'], 'bottom row names');
    eq(row(g, 0).map(p => p.midi), [60,62,64,65,67,69,71,72], 'bottom row pitches');
    eq(at(g, 1, 0).name, 'F', '(1,0) name');
    eq(at(g, 1, 0).midi, 65, '(1,0) pitch');
  });

  test('AT3 (grid part) C Major · In Key · 3rds: (0,0) (1,0) (2,0) are C E G stacked', () => {
    const g = M.buildGrid(S({ layout: '3rds' }));
    eq([at(g,0,0), at(g,1,0), at(g,2,0)].map(p => p.fullName), ['C3','E3','G3'], 'column 0, rows 0–2');
  });

  test('AT5 C Major · Chromatic · 4ths: bottom row C C♯ D D♯ E F F♯ G, row 2 starts on F, out-of-scale dimmed', () => {
    const g = M.buildGrid(S({ mode: 'chromatic' }));
    eq(row(g, 0).map(p => p.name), ['C','C♯','D','D♯','E','F','F♯','G'], 'bottom row names');
    eq(at(g, 1, 0).midi, 65, '(1,0) pitch F3');
    eq(row(g, 0).map(p => p.state), ['root','out','in','out','in','in','out','in'], 'bottom row states');
    eq(g.filter(p => p.state === 'out').every(p => !p.inScale), true, 'every dimmed pad is out of scale');
  });

  // ---- Supporting checks ----
  test('Every v1 scale has 7 ascending notes starting on 0', () => {
    for (const sc of M.SCALES) {
      eq(sc.intervals.length, 7, sc.name + ' length');
      eq(sc.intervals[0], 0, sc.name + ' starts on 0');
      eq(sc.intervals.every((v, i, a) => i === 0 || v > a[i - 1]) && sc.intervals[6] < 12, true, sc.name + ' ascending');
    }
  });

  test('scaleNotes: D Dorian is D E F G A B C', () => {
    eq(M.scaleNotes('D', 'Dorian').map(pc => M.noteName(pc, false)), ['D','E','F','G','A','B','C'], 'notes');
  });

  test('In Key 4ths: each row starts 3 scale degrees up (a diatonic 4th, so F→B is a tritone)', () => {
    const g = M.buildGrid(S({}));
    eq([0,1,2,3,4,5,6,7].map(r => at(g, r, 0).name), ['C','F','B','E','A','D','G','C'], 'left column');
    eq([0,1,2,3,4,5,6,7].map(r => at(g, r, 0).midi), [60,65,71,76,81,86,91,96], 'left column pitches');
  });

  test('In Key: no out-of-scale pads in any layout', () => {
    for (const layout of Object.keys(M.LAYOUTS)) {
      const g = M.buildGrid(S({ layout, key: 'E♭', scale: 'Harmonic Minor' }));
      eq(g.every(p => p.inScale), true, layout);
    }
  });

  test('Sequential In Key: row 2 continues from the end of row 1', () => {
    const g = M.buildGrid(S({ layout: 'sequential' }));
    eq(at(g, 0, 7).fullName, 'C4', '(0,7)');
    eq(at(g, 1, 0).fullName, 'D4', '(1,0)');
  });

  test('Sequential Chromatic: row 2 starts 8 semitones up', () => {
    const g = M.buildGrid(S({ layout: 'sequential', mode: 'chromatic' }));
    eq(at(g, 1, 0).midi - at(g, 0, 0).midi, 8, 'offset');
  });

  test('Columns ▶ orientation swaps the axes', () => {
    const rows = M.buildGrid(S({}));
    const cols = M.buildGrid(S({ orientation: 'columns' }));
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++)
      eq(at(cols, r, c).midi, at(rows, c, r).midi, `(${r},${c})`);
    eq([0,1,2,3].map(r => at(cols, r, 0).name), ['C','D','E','F'], 'up the left column');
  });

  test('Fixed Off: bottom-left is the key root (A Minor, octave 3 → A3 = 69)', () => {
    eq(M.buildGrid(S({ key: 'A', scale: 'Minor' }))[0].fullName, 'A3', 'In Key');
    eq(M.buildGrid(S({ key: 'A', scale: 'Minor', mode: 'chromatic' }))[0].fullName, 'A3', 'Chromatic');
  });

  test('Fixed On · Chromatic: bottom-left is C, root pads tinted for the key', () => {
    const g = M.buildGrid(S({ key: 'D', fixed: true, mode: 'chromatic' }));
    eq(g[0].fullName, 'C3', 'bottom-left');
    eq(g[0].state, 'out', 'C is not in D Major');
    eq(at(g, 0, 2).state, 'root', 'D at (0,2) is tinted as root');
  });

  test('Fixed On · In Key: bottom-left is the lowest scale note at or above C', () => {
    eq(M.buildGrid(S({ key: 'D', fixed: true }))[0].fullName, 'C♯3', 'D Major → C♯3');
    eq(M.buildGrid(S({ key: 'F', fixed: true }))[0].fullName, 'C3', 'F Major → C3');
    eq(M.buildGrid(S({ key: 'B', fixed: true }))[0].fullName, 'C♯3', 'B Major → C♯3');
    const g = M.buildGrid(S({ key: 'D', fixed: true }));
    eq(row(g, 0).map(p => p.name), ['C♯','D','E','F♯','G','A','B','C♯'], 'D Major fixed bottom row');
  });

  test('Spelling: flat-side keys use flats, C and sharp keys use sharps', () => {
    eq(M.buildGrid(S({ key: 'F', mode: 'chromatic' })).slice(0, 8).map(p => p.name),
       ['F','G♭','G','A♭','A','B♭','B','C'], 'F chromatic');
    eq(M.usesFlats('D', 'Minor'), true, 'D Minor shares F Major’s signature');
    eq(M.usesFlats('A', 'Minor'), false, 'A Minor has no accidentals');
  });

  test('Pads outside MIDI 0–127 are void', () => {
    const g = M.buildGrid(S({ layout: 'sequential', octave: 7 }));
    eq(g.filter(p => p.midi > 127).every(p => p.state === 'void'), true, 'void above 127');
    eq(g.some(p => p.state === 'void'), true, 'some exist');
  });

  test('normaliseSettings: rejects junk, keeps valid values', () => {
    eq(M.normaliseSettings(null), { ...M.DEFAULT_SETTINGS }, 'null → defaults');
    const s = M.normaliseSettings({ key: 'H', scale: 'Dorian', octave: 99, fixed: 'yes', layout: '3rds' });
    eq([s.key, s.scale, s.octave, s.fixed, s.layout], ['C', 'Dorian', M.OCTAVE_MAX, false, '3rds'], 'mixed');
  });

  // ---- Stage 2: chords and shapes ----
  const C = over => M.normaliseChord({ source: 'diatonic', degree: 1, type: 'triad', inversion: 0, ...over });
  const coords = (shape) => shape.pads.map(i => [Math.floor(i / 8), i % 8]);
  const shapeFor = (chord, s, anchor) => M.placeShape(M.chordPitches(chord, s), M.buildGrid(s), anchor);

  test('AT2 C Major · I triad lights (0,0) C, (0,2) E and (1,1) G', () => {
    const s = S({});
    const sh = shapeFor(C({}), s).primary;
    eq(coords(sh), [[0,0],[0,2],[1,1]], 'primary pads');
    eq(M.chordNoteNames(C({}), s), ['C','E','G'], 'notes');
    eq(M.chordName(C({}), s), 'C', 'name');
    eq(M.romanNumeral(C({}), s), 'I', 'numeral');
  });

  test('AT3 C Major · In Key · 3rds: I triad is a vertical column at (0,0), (1,0), (2,0)', () => {
    eq(coords(shapeFor(C({}), S({ layout: '3rds' })).primary), [[0,0],[1,0],[2,0]], 'primary pads');
  });

  test('AT4 D Dorian: degree 1 is Dm and degree 4 is G', () => {
    const s = S({ key: 'D', scale: 'Dorian' });
    eq(M.chordName(C({ degree: 1 }), s), 'Dm', 'degree 1');
    eq(M.chordName(C({ degree: 4 }), s), 'G', 'degree 4');
    eq([M.romanNumeral(C({ degree: 1 }), s), M.romanNumeral(C({ degree: 4 }), s)], ['i', 'IV'], 'numerals');
  });

  test('AT9 C Major · I · 1st inversion is C/E with E as the bass pad', () => {
    const s = S({}), ch = C({ inversion: 1 });
    eq(M.chordName(ch, s), 'C/E', 'name');
    eq(M.chordNoteNames(ch, s), ['E','G','C'], 'notes');
    const sh = shapeFor(ch, s).primary;
    eq(M.buildGrid(s)[sh.bass].fullName, 'E3', 'bass pad pitch');
    eq(coords(sh)[0], [0,2], 'bass pad position');
  });

  test('C Major diatonic triads and numerals', () => {
    const s = S({});
    eq([1,2,3,4,5,6,7].map(d => M.chordName(C({ degree: d }), s)), ['C','Dm','Em','F','G','Am','Bdim'], 'names');
    eq([1,2,3,4,5,6,7].map(d => M.romanNumeral(C({ degree: d }), s)), ['I','ii','iii','IV','V','vi','vii°'], 'numerals');
  });

  test('C Major diatonic sevenths and numerals', () => {
    const s = S({});
    eq([1,2,3,4,5,6,7].map(d => M.chordName(C({ degree: d, type: '7' }), s)),
       ['Cmaj7','Dm7','Em7','Fmaj7','G7','Am7','Bm7♭5'], 'names');
    eq([1,2,3,4,5,6,7].map(d => M.romanNumeral(C({ degree: d, type: '7' }), s)),
       ['Imaj7','ii7','iii7','IVmaj7','V7','vi7','viiø7'], 'numerals');
  });

  test('A Minor numerals are relative to A Major', () => {
    const s = S({ key: 'A', scale: 'Minor' });
    eq([1,2,3,4,5,6,7].map(d => M.romanNumeral(C({ degree: d }), s)), ['i','ii°','♭III','iv','v','♭VI','♭VII'], 'numerals');
    eq([1,3,6,7].map(d => M.chordName(C({ degree: d }), s)), ['Am','C','F','G'], 'names');
  });

  test('A Harmonic Minor degree 5 is E with G♯', () => {
    const s = S({ key: 'A', scale: 'Harmonic Minor' });
    eq(M.chordName(C({ degree: 5 }), s), 'E', 'name');
    eq(M.chordNoteNames(C({ degree: 5 }), s), ['E','G♯','B'], 'notes');
    eq(M.romanNumeral(C({ degree: 5 }), s), 'V', 'numeral');
  });

  test('Other types: sus2, sus4, add9, 6', () => {
    const s = S({});
    eq(M.chordName(C({ type: 'sus2' }), s), 'Csus2', 'sus2');
    eq(M.chordName(C({ type: 'sus4', degree: 5 }), s), 'Gsus4', 'sus4');
    eq(M.chordName(C({ type: 'add9' }), s), 'Cadd9', 'add9');
    eq(M.chordNoteNames(C({ type: 'add9' }), s), ['C','E','G','D'], 'add9 notes');
    eq(M.chordName(C({ type: '6', degree: 2 }), s), 'Dm6', 'm6');
    eq(M.chordName(C({ type: 'sus4', degree: 7 }), s), 'B(4,♭5)', 'odd stack falls back to intervals');
  });

  test('Inversions: 2nd inversion triad and 3rd inversion seventh', () => {
    const s = S({});
    eq(M.chordName(C({ inversion: 2 }), s), 'C/G', 'C/G');
    eq(M.chordNoteNames(C({ inversion: 2 }), s), ['G','C','E'], 'C/G notes');
    eq(M.chordName(C({ degree: 5, type: '7', inversion: 3 }), s), 'G7/F', 'G7/F');
    eq(M.chordNoteNames(C({ degree: 5, type: '7', inversion: 3 }), s), ['F','G','B','D'], 'G7/F notes');
    eq(M.chordNoteNames(C({ type: 'add9', inversion: 3 }), s), ['D','E','G','C'], 'Cadd9/D notes');
    eq(M.normaliseChord({ type: 'triad', inversion: 3 }).inversion, 0, 'triad has no 3rd inversion');
  });

  test('Spelling: ♭VII in C is B♭ (flats for a black-key ♭ root), ♭VII in E Minor keeps F♯', () => {
    // A diatonic stand-in for borrowed chords until stage 3: degree 7 of C Mixolydian.
    eq(M.chordNoteNames(C({ degree: 7 }), S({ scale: 'Mixolydian' })), ['B♭','D','F'], 'B♭ D F');
    eq(M.romanNumeral(C({ degree: 7 }), S({ scale: 'Mixolydian' })), '♭VII', 'numeral');
    eq(M.chordNoteNames(C({ degree: 7 }), S({ key: 'E', scale: 'Minor' })), ['D','F♯','A'], 'D F♯ A');
  });

  test('Shape pads hold exactly the chord pitches', () => {
    for (const layout of ['4ths', '3rds', 'sequential']) for (const mode of ['inKey', 'chromatic'])
      for (let d = 1; d <= 7; d++) {
        const s = S({ layout, mode, key: 'E♭', scale: 'Dorian' }), ch = C({ degree: d, type: '7', inversion: 1 });
        const g = M.buildGrid(s), p = M.chordPitches(ch, s), sh = M.placeShape(p, g).primary;
        eq(sh.pads.map(i => g[i].midi - g[sh.bass].midi), p.map(x => x - p[0]), `${layout} ${mode} degree ${d}`);
      }
  });

  test('Other positions: each starts on a different bass pad with the bass pitch class', () => {
    const s = S({}), g = M.buildGrid(s), res = shapeFor(C({}), s);
    eq(res.others.length > 0, true, 'some other positions');
    const basses = [res.primary, ...res.others].map(sh => sh.bass);
    eq(new Set(basses).size, basses.length, 'distinct bass pads');
    eq(res.others.every(sh => g[sh.bass].pc === 0), true, 'all on C');
  });

  test('Anchor: tapping another C pad makes it the primary position', () => {
    const s = S({}), g = M.buildGrid(s);
    const c4 = g.findIndex(p => p.fullName === 'C4' && p.r === 1);   // (1,4)
    const res = shapeFor(C({}), s, c4);
    eq(res.primary.bass, c4, 'primary bass');
    eq(res.anchorMissed, false, 'anchor fits');
    eq(shapeFor(C({}), s, 63).anchorMissed, true, 'non-bass pad is not an anchor');
  });

  test('Shape that does not fit from the lowest bass moves to the next bass pad', () => {
    // Sequential In Key at octave 7: low pads exist but high notes run past MIDI 127.
    const s = S({ layout: 'sequential', octave: 6 }), g = M.buildGrid(s);
    const res = shapeFor(C({ type: 'add9' }), s);
    eq(res.primary === null || res.primary.pads.every(i => g[i].valid), true, 'only valid pads used');
  });

  // ---- Stage 3: borrowed chords and the In Key warning ----
  const B = (sourceMode, degree, over) => M.normaliseChord({ source: 'borrowed', sourceMode, degree, type: 'triad', inversion: 0, ...over });

  test('AT6 C Major · ♭VII is B♭ – ♭VII – B♭ D F, warns in In Key, places fully in Chromatic', () => {
    const s = S({}), ch = B('Minor', 7);
    eq(M.borrowedChords(s, 'triad').some(c => c.sourceMode === 'Minor' && c.degree === 7), true, 'offered in C Major');
    eq(`${M.chordName(ch, s)} – ${M.romanNumeral(ch, s)} – ${M.chordNoteNames(ch, s).join(' ')}`, 'B♭ – ♭VII – B♭ D F', 'readout');
    const inKey = M.placeChord(ch, s, M.buildGrid(s));
    eq(inKey.missing.map(m => m.name), ['B♭'], 'missing notes');
    eq(M.missingMessage(inKey.missing), 'Switch Push to Chromatic – 1 note not in scale (B♭)', 'banner');
    eq(inKey.primary.pads.length, 2, 'In Key lights the 2 playable notes');
    eq(inKey.bassMissing, true, 'bass is the missing note');
    const sc = S({ mode: 'chromatic' }), gc = M.buildGrid(sc);   // what "Show in Chromatic" does
    const chrom = M.placeChord(ch, sc, gc);
    eq(chrom.missing, [], 'nothing missing in Chromatic');
    eq(chrom.primary.pads.map(i => gc[i].midi - gc[chrom.primary.bass].midi), [0, 4, 7], 'full major triad shape');
    eq(gc[chrom.primary.bass].pc, 10, 'bass pad is B♭');
  });

  test('AT7 A Minor · V comes from Harmonic Minor and is E major with G♯', () => {
    const s = S({ key: 'A', scale: 'Minor' });
    const v = M.borrowedChords(s, 'triad').find(c => M.romanNumeral(c, s) === 'V');
    eq(v && v.sourceMode, 'Harmonic Minor', 'source mode');
    eq(M.chordName(v, s), 'E', 'name');
    eq(M.chordNoteNames(v, s), ['E','G♯','B'], 'notes');
    eq(M.missingNotes(v, s).map(m => m.name), ['G♯'], 'G♯ not in A Minor');
  });

  test('Families: scales with a major 3rd get the major list', () => {
    eq(['Major','Lydian','Mixolydian','Harmonic Major','Phrygian Dominant'].map(M.scaleFamily), Array(5).fill('major'), 'major');
    eq(['Minor','Dorian','Phrygian','Locrian','Harmonic Minor','Melodic Minor'].map(M.scaleFamily), Array(6).fill('minor'), 'minor');
  });

  test('C Major borrowed list: numerals, names and spelling', () => {
    const s = S({}), list = M.borrowedChords(s, 'triad');
    eq(list.map(c => M.romanNumeral(c, s)), ['iv','♭III','♭VI','♭VII','v','ii°','♭II','II'], 'numerals');
    eq(list.map(c => M.chordName(c, s)), ['Fm','E♭','A♭','B♭','Gm','Ddim','D♭','D'], 'names');
    eq(M.chordNoteNames(list[0], s), ['F','A♭','C'], 'iv spelt with A♭');
    eq(M.chordNoteNames(list[7], s), ['D','F♯','A'], 'II spelt with F♯');
  });

  test('A Minor borrowed list numerals (ii, not II, from Dorian)', () => {
    const s = S({ key: 'A', scale: 'Minor' });
    eq(M.borrowedChords(s, 'triad').map(c => M.romanNumeral(c, s)), ['IV','V','I','ii','♭II','vi°'], 'numerals');
  });

  test('Borrowed chords that match a diatonic chord are left out', () => {
    const s = S({ scale: 'Mixolydian' });
    const nums = M.borrowedChords(s, 'triad').map(c => M.romanNumeral(c, s));
    eq(nums.includes('♭VII') || nums.includes('v'), false, '♭VII and v are diatonic in Mixolydian');
    eq(M.borrowedChords(S({ key: 'A', scale: 'Harmonic Minor' }), 'triad').some(c => c.sourceMode === 'Harmonic Minor'), false, 'V is diatonic in Harmonic Minor');
  });

  test('Borrowed chords take the chosen type and inversion', () => {
    const s = S({});
    eq(M.chordName(B('Minor', 4, { type: '7' }), s), 'Fm7', 'iv7');
    eq(M.romanNumeral(B('Minor', 4, { type: '7' }), s), 'iv7', 'iv7 numeral');
    eq(M.chordName(B('Minor', 7, { inversion: 1 }), s), 'B♭/D', 'B♭/D');
  });

  test('Diatonic chords are never missing notes; plurals in the banner', () => {
    for (const scale of M.SCALES.map(x => x.name)) for (let d = 1; d <= 7; d++)
      eq(M.missingNotes(C({ degree: d, type: 'add9' }), S({ key: 'G♭', scale })).length, 0, `${scale} ${d}`);
    const m = M.missingNotes(B('Minor', 6, { type: '7' }), S({}));
    eq(M.missingMessage(m), 'Switch Push to Chromatic – 2 notes not in scale (A♭, E♭)', 'two notes');
  });

  test('Anchor still works when the bass is missing (taps go to the lowest playable note)', () => {
    const s = S({}), g = M.buildGrid(s), ch = B('Minor', 7);
    const first = M.placeChord(ch, s, g);
    eq(first.anchorPc, 2, 'anchor on D');
    const other = first.others[0].bass;
    eq(M.placeChord(ch, s, g, other).primary.bass, other, 're-anchored');
  });

  // ---- Stage 4: what the readout plays ----
  const midiOf = (chord, s, anchor) => { const g = M.buildGrid(s); return M.chordMidi(chord, s, M.placeChord(chord, s, g, anchor), g); };

  test('Readout plays the lit shape: C Major I is C3 E3 G3, C/E is E3 G3 C4', () => {
    eq(midiOf(C({}), S({})), [60, 64, 67], 'I');
    eq(midiOf(C({ inversion: 1 }), S({})), [64, 67, 72], 'C/E');
  });

  test('Readout follows the anchor and the octave setting', () => {
    const s = S({}), g = M.buildGrid(s);
    eq(midiOf(C({}), s, g.findIndex(p => p.midi === 72)), [72, 76, 79], 'anchored on C4');
    eq(midiOf(C({}), S({ octave: 1 })), [36, 40, 43], 'octave 1');
  });

  test('Readout plays the full chord even when In Key is missing the bass (♭VII → B♭2 D3 F3)', () => {
    eq(midiOf(B('Minor', 7), S({})), [58, 62, 65], 'In Key');
    eq(midiOf(B('Minor', 7), S({ mode: 'chromatic' })), [70, 74, 77], 'Chromatic shape starts on B♭3');
  });

  test('Chord with no shape on the grid still plays at the settings octave', () => {
    const s = S({ octave: 2 });
    eq(M.chordMidi(C({ degree: 5 }), s, null, M.buildGrid(s)), [55, 59, 62], 'G2 B2 D3');
  });

  // ---- Stage 5: progressions ----
  const preset = name => M.PRESETS.find(p => p.name === name);
  const dia = d => M.normaliseChord({ degree: d });

  test('AT8 I–V–vi–IV moved from C to A gives A, E, F♯m, D', () => {
    const p = M.presetProgression(preset('I–V–vi–IV'), 'C', 'p1');
    eq(M.progressionChordNames(p), ['C','G','Am','F'], 'in C');
    eq(M.progressionChordNames({ ...p, key: 'A' }), ['A','E','F♯m','D'], 'in A');
    eq(M.progressionSummary({ ...p, key: 'A' }), 'I–V–vi–IV', 'summary unchanged');
  });

  test('Presets give the expected chords', () => {
    eq(M.progressionChordNames(M.presetProgression(preset('ii–V–I'), 'C', 'x')), ['Dm','G','C'], 'ii–V–I in C');
    eq(M.progressionChordNames(M.presetProgression(preset('i–♭VI–♭III–♭VII'), 'A', 'x')), ['Am','F','C','G'], 'in A Minor');
    eq(M.progressionChordNames(M.presetProgression(preset('i–iv–v'), 'E', 'x')), ['Em','Am','Bm'], 'in E Minor');
    eq(M.progressionChordNames(M.presetProgression(preset('I–♭VII–IV'), 'C', 'x')), ['C','B♭','F'], 'I–♭VII–IV in C');
    for (const pr of M.PRESETS) eq(M.progressionSummary(M.presetProgression(pr, 'D', 'x')), pr.name, 'summary matches name: ' + pr.name);
  });

  test('normaliseProgression pads to 8 slots and drops junk', () => {
    const p = M.normaliseProgression({ id: 'a', name: '  ', key: 'H', scale: 'Nope', slots: [{ degree: 2 }, 'x', null] });
    eq([p.name, p.key, p.scale, p.slots.length], ['Untitled', 'C', 'Major', 8], 'fields');
    eq(p.slots[0].degree, 2, 'slot 1 kept');
    eq(p.slots.slice(1).every(x => x === null), true, 'rest empty');
    eq(M.normaliseProgression({ name: 'no id' }), null, 'needs an id');
  });

  test('moveSlot moves up and down, ignores moves off the ends', () => {
    eq(M.moveSlot(['a','b','c'], 1, 0), ['b','a','c'], 'up');
    eq(M.moveSlot(['a','b','c'], 1, 2), ['a','c','b'], 'down');
    eq(M.moveSlot(['a','b','c'], 0, -1), ['a','b','c'], 'off the top');
  });

  test('stepIndex skips empty slots and wraps', () => {
    const p = M.makeProgression({ id: 'x', key: 'C', scale: 'Major', chords: [dia(1), null, dia(4), dia(5)] });
    eq([M.stepIndex(p, 0, 1), M.stepIndex(p, 2, 1), M.stepIndex(p, 3, 1)], [2, 3, 0], 'forwards');
    eq([M.stepIndex(p, 0, -1), M.stepIndex(p, 2, -1)], [3, 0], 'backwards');
    eq(M.stepIndex(M.makeProgression({ id: 'y', key: 'C', scale: 'Major' }), 0, 1), -1, 'all empty');
  });

  test('sharedPcs: C and Am share C and E', () => {
    eq([...M.sharedPcs(dia(1), dia(6), S({}))].sort((a, b) => a - b), [0, 4], 'C, E');
    eq(M.sharedPcs(dia(1), dia(2), S({})).size, 0, 'C and Dm share nothing');
  });

  test('Backup: parse both formats, reject others, merge by id', () => {
    const a = M.makeProgression({ id: 'a', name: 'A', key: 'C', scale: 'Major' });
    const b = M.makeProgression({ id: 'b', name: 'B', key: 'G', scale: 'Major' });
    eq(M.parseBackup(JSON.stringify([a])).length, 1, 'array');
    eq(M.parseBackup(JSON.stringify({ progressions: [a, b, { junk: 1 }] })).length, 2, 'object, junk dropped');
    let threw = false; try { M.parseBackup('{"x":1}'); } catch (e) { threw = true; }
    eq(threw, true, 'rejects other JSON');
    const merged = M.mergeProgressions([a], [{ ...a, name: 'A2' }, b]);
    eq(merged.map(p => p.name), ['A2', 'B'], 'replaced and added');
  });

  // ---- Stage 6: storage (AT10, the part a test page can check) ----
  test('AT10 (storage part) settings and progressions round-trip through localStorage', () => {
    const keep = { settings: localStorage.getItem(Store.KEYS.settings), progressions: localStorage.getItem(Store.KEYS.progressions) };
    try {
      const s = S({ key: 'E♭', scale: 'Dorian', mode: 'chromatic', octave: 2, volume: 0.35 });
      const p = M.presetProgression(preset('ii–V–I'), 'F', 'rt');
      eq(Store.write('settings', s) && Store.write('progressions', [p]), true, 'writes succeed');
      eq(M.normaliseSettings(Store.read('settings', null)), s, 'settings back intact');
      eq(Store.read('progressions', []).map(M.normaliseProgression), [p], 'progressions back intact');
      eq(Store.read('nope', 'fallback'), 'fallback', 'unknown key falls back');
    } finally {
      for (const k of ['settings', 'progressions']) {
        if (keep[k] == null) localStorage.removeItem(Store.KEYS[k]); else localStorage.setItem(Store.KEYS[k], keep[k]);
      }
    }
  });

  return results;
}

function renderTests(results) {
  const el = document.getElementById('tests');
  const failed = results.filter(r => !r.ok).length;
  const esc = t => t.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
  el.innerHTML = `<h1 class="${failed ? 'fail' : 'pass'}">${failed ? `${failed} failed` : 'All passed'} – ${results.length} tests</h1>
    <ul>${results.map(r => `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${esc(r.name)}${r.ok ? '' : `<pre>${esc(r.msg)}</pre>`}</li>`).join('')}</ul>
    <p><a href="./" style="color:var(--text)">Back to the app</a></p>`;
  el.hidden = false;
  window.__testResults = results;
}

/* =====================================================================
   UI
   ===================================================================== */
const UI = (() => {
  const $ = id => document.getElementById(id);
