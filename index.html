  const esc = t => String(t).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const INV_LABELS = ['Root', '1st', '2nd', '3rd'];
  // Settings that move pads around; changing one drops the tapped anchor.
  const GRID_SETTINGS = new Set(['key', 'scale', 'mode', 'layout', 'orientation', 'fixed', 'octave']);
  const BOOLEAN_SETTINGS = new Set(['fixed', 'strum']);

  let settings = Music.normaliseSettings(Store.read('settings', null));
  let progressions = loadProgressions();
  let view = 'reference';     // 'reference' | 'play' | 'list' | 'edit'
  let refChord = Music.normaliseChord({ degree: 1, type: 'triad' }); // null = no chord shown
  let anchor = null;          // pad index chosen as the bass, or null for the default
  let grid = [];
  let shape = null;           // result of placeChord for the current chord
  let editId = null;          // progression open in the editor
  let playId = null, playIndex = 0;
  let pickSlot = null, pickType = 'triad';   // slot picker state
  const heldPads = new Map(); // pointerId → synth voice, for pads held down
  let padEls = null;          // the 64 pad buttons, kept so colour changes can animate
  let popKey = '';            // what the lit shape was last drawn for
  let readoutDir = 0;         // −1 / +1: slide the readout in from that side

  /* ---------- motion ---------- */

  const EASE = 'cubic-bezier(.2,.8,.2,1)';
  const motionOK = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function anim(el, frames, opts) {
    if (el && el.animate && motionOK()) return el.animate(frames, opts);
  }

  /** Pads light up briefly, in strum order when gap > 0. */
  function strike(indices, gap = 0) {
    const els = ensurePads();
    indices.forEach((i, k) => anim(els[i], [
      { filter: 'brightness(1.8)', transform: 'scale(.92)' },
      { filter: 'brightness(1)', transform: 'scale(1)' },
    ], { duration: 460, delay: k * gap, easing: 'ease-out' }));
  }

  /** Slide each segmented control's thumb under its selected button. */
  function updateThumbs() {
    document.querySelectorAll('.seg').forEach(seg => {
      const on = seg.querySelector('[aria-checked="true"], [aria-selected="true"]');
      if (!on) { seg.classList.remove('has-thumb'); return; }
      if (!seg.offsetParent) return;          // hidden: position it when shown
      seg.style.setProperty('--tx', on.offsetLeft + 'px');
      seg.style.setProperty('--tw', on.offsetWidth + 'px');
      seg.classList.add('has-thumb');
      if (!seg.dataset.ready) requestAnimationFrame(() => { seg.dataset.ready = '1'; });
    });
  }

  /** Sheets slide up and fade the backdrop; hidden again once closed. */
  function showLayer(el) {
    el.hidden = false;
    void el.offsetWidth;                      // start the transition from the closed state
    el.classList.add('open');
    updateThumbs();
  }
  function hideLayer(el) {
    if (el.hidden) return;
    el.classList.remove('open');
    const done = () => { if (!el.classList.contains('open')) el.hidden = true; };
    el.addEventListener('transitionend', e => { if (e.target === el) done(); }, { once: true });
    setTimeout(done, 400);                    // in case transitions are off
  }

  /* ---------- data ---------- */

  function loadProgressions() {
    const raw = Store.read('progressions', []);
    return Array.isArray(raw) ? raw.map(Music.normaliseProgression).filter(Boolean) : [];
  }
  function saveProgressions() { Store.write('progressions', progressions); }
  const progById = id => progressions.find(p => p.id === id) || null;
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function updateProg(id, fn) {
    const p = progById(id);
    if (!p) return;
    fn(p);
    p.updatedAt = Date.now();
    saveProgressions();
  }

  function addProg(p) {
    progressions.unshift(p);
    saveProgressions();
    return p;
  }

  const playProg = () => (view === 'play' ? progById(playId) : null);

  /** Settings in force: a progression being played brings its own key and scale. */
  function eff() {
    const p = playProg();
    return p ? Music.progressionSettings(p, settings) : settings;
  }
  function currentChord() {
    const p = playProg();
    return p ? p.slots[playIndex] || null : refChord;
  }
  function previousChord() {
    const p = playProg();
    if (!p) return null;
    const i = Music.stepIndex(p, playIndex, -1);
    return i >= 0 && i !== playIndex ? p.slots[i] : null;
  }

  /* ---------- actions ---------- */

  function setSetting(name, value) {
    // While playing a progression, Key and Scale change the progression (it transposes).
    if (playProg() && (name === 'key' || name === 'scale')) {
      updateProg(playId, p => { p[name] = value; });
      anchor = null;
      render();
      return;
    }
    settings = Music.normaliseSettings({ ...settings, [name]: value });
    Store.write('settings', settings);
    if (name === 'volume') { Synth.setVolume(settings.volume); return; }
    if (GRID_SETTINGS.has(name)) anchor = null;
    render();
  }

  function setRefChord(next) {
    refChord = next ? Music.normaliseChord(next) : null;
    anchor = null;
    render();
  }

  function playCurrent() {
    const ch = currentChord();
    if (!ch) return;
    Synth.unlock();
    Synth.playChord(Music.chordMidi(ch, eff(), shape, grid), { strum: settings.strum });
    if (shape && shape.primary) strike(shape.primary.pads, settings.strum ? 15 : 0);
    anim($('readout'), [
      { borderColor: '#ffa43a', boxShadow: '0 0 24px rgba(255,164,58,.35)' },
      { borderColor: '#2a2a2a', boxShadow: '0 0 0 rgba(255,164,58,0)' },
    ], { duration: 650, easing: 'ease-out' });
  }

  function go(next) {
    view = next;
    anchor = null;
    if (view !== 'edit') closePicker();
    render();
    window.scrollTo(0, 0);
    const el = view === 'reference' || view === 'play' ? $('stage') : $('progView');
    anim(el, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: EASE });
  }

  function startPlay(id) {
    const p = progById(id);
    if (!p) return;
    playId = id;
    const first = p.slots.findIndex(Boolean);
    playIndex = first === -1 ? 0 : first;
    go('play');
  }

  function step(dir) {
    const p = playProg();
    if (!p) return;
    const i = Music.stepIndex(p, playIndex, dir);
    if (i < 0) return;
    playIndex = i;
    anchor = null;
    readoutDir = dir;
    render();
    playCurrent();
  }

  function openEditor(id) { editId = id; go('edit'); }

  /* ---------- shared chord-button markup ---------- */

  function diatonicHTML(s, selected, type) {
    return [1,2,3,4,5,6,7].map(d => {
      const ch = Music.normaliseChord({ degree: d, type });
      const on = selected && selected.source === 'diatonic' && selected.degree === d;
      return `<button class="chord-btn" data-src="diatonic" data-degree="${d}" aria-pressed="${!!on}">
        <span class="n">${Music.romanNumeral(ch, s)}</span>
        <span class="c">${Music.chordName(ch, s)}</span></button>`;
    }).join('');
  }

  function borrowedHTML(s, selected, type) {
    return `<span class="tag">Bor&shy;rowed</span>` + Music.borrowedChords(s, type).map(ch => {
      const on = selected && selected.source === 'borrowed' && selected.sourceMode === ch.sourceMode && selected.degree === ch.degree;
      const warn = s.mode === 'inKey' && Music.missingNotes(ch, s).length > 0;
      return `<button class="chord-btn" data-src="borrowed" data-mode="${ch.sourceMode}" data-degree="${ch.degree}" aria-pressed="${!!on}"
        title="From ${s.key} ${ch.sourceMode}">
        ${warn ? '<span class="w" aria-label="Not playable in In Key">⚠</span>' : ''}
        <span class="n">${Music.romanNumeral(ch, s)}</span>
        <span class="c">${Music.chordName(ch, s)}</span></button>`;
    }).join('');
  }

  function typesHTML(type) {
    return Music.CHORD_TYPES.map(t =>
      `<button role="radio" data-type="${t.id}" aria-checked="${type === t.id}">${t.label}</button>`).join('');
  }

  /** The chord a diatonic or borrowed button stands for, keeping type and inversion. */
  function chordFromButton(b, base) {
    return Music.normaliseChord({
      source: b.dataset.src, sourceMode: b.dataset.mode || null, degree: +b.dataset.degree,
      type: base ? base.type : 'triad', inversion: base ? base.inversion : 0,
    });
  }
  const sameChordButton = (b, ch) => ch && ch.source === b.dataset.src && ch.degree === +b.dataset.degree
    && (ch.source === 'diatonic' || ch.sourceMode === b.dataset.mode);

  /* ---------- rendering: grid stage ---------- */

  function computeShape() {
    const s = eff(), ch = currentChord();
    grid = Music.buildGrid(s);
    shape = ch ? Music.placeChord(ch, s, grid, anchor) : null;
  }

  function renderHeader() {
    const s = eff();
    $('key').value = s.key;
    $('scale').value = s.scale;
    $('scaleCaption').textContent = playProg() ? 'Scale – progression' : 'Scale';
    $('volume').value = settings.volume;
    document.querySelectorAll('[data-set]').forEach(btn => {
      btn.setAttribute('aria-checked', String(String(settings[btn.dataset.set]) === btn.dataset.val));
    });
    const L = Music.LAYOUTS[settings.layout].label;
    const o = settings.orientation === 'rows' ? '▲' : '▶';
    $('summary').textContent = `${L} ${o} · Fixed ${settings.fixed ? 'on' : 'off'} · Oct ${settings.octave}`;
    $('octOut').textContent = `C${settings.octave} (MIDI ${12 * (settings.octave + 2)})`;
    const n = Music.scaleNotice(s);
    $('notice').hidden = !n;
    $('notice').textContent = n || '';
  }

  function renderGrid() {
    const s = eff(), ch = currentChord();
    const el = $('grid');
    el.classList.toggle('labels-off', settings.labels !== 'all');
    const primary = new Set(shape && shape.primary ? shape.primary.pads : []);
    const ghosts = new Set(shape ? shape.others.flatMap(sh => sh.pads) : []);
    // No bass ring when the real bass note is missing (In Key, out of scale).
    const ringed = shape && !shape.bassMissing;
    const ghostBasses = new Set(ringed ? shape.others.map(sh => sh.bass) : []);
    const bass = ringed && shape.primary ? shape.primary.bass : -1;
    const flats = ch ? Music.chordSpellsFlat(ch, s) : null;
    const prev = ch && previousChord();
    const shared = prev ? Music.sharedPcs(prev, ch, s) : new Set();

    const els = ensurePads();
    for (let r = 7; r >= 0; r--) {
      for (let c = 0; c < 8; c++) {
        const i = r * 8 + c, p = grid[i], b = els[i];
        let cls = 'pad ' + p.state, name = p.name;
        if (primary.has(i)) {
          cls += ' chord';
          name = Music.noteName(p.pc, flats);
          if (shared.has(p.pc)) cls += ' shared';
        } else if (ghosts.has(i)) {
          cls += ' ghost';
          name = Music.noteName(p.pc, flats);
        }
        if (i === bass || (ghostBasses.has(i) && !primary.has(i))) cls += ' bass';
        if (b.className !== cls) b.className = cls;
        const label = p.valid ? name : '';
        if (b.firstChild.textContent !== label) b.firstChild.textContent = label;
        b.setAttribute('aria-label', p.valid ? p.fullName : 'unused');
      }
    }
    // A new chord or position: pop the lit pads in, bass first.
    const key = ch ? JSON.stringify([view, playIndex, ch, anchor, s.key, s.scale, s.mode, s.layout, s.orientation, s.fixed]) : '';
    if (key && key !== popKey && shape && shape.primary) {
      shape.primary.pads.forEach((i, k) => anim(els[i], [
        { transform: 'scale(.55)', filter: 'brightness(1.9)' },
        { transform: 'scale(1.08)', filter: 'brightness(1.2)', offset: .55 },
        { transform: 'scale(1)', filter: 'brightness(1)' },
      ], { duration: 380, delay: k * 45, easing: EASE, fill: 'backwards' }));
    }
    popKey = key;
  }

  function ensurePads() {
    if (padEls) return padEls;
    padEls = new Array(64);
    const frag = document.createDocumentFragment();
    for (let r = 7; r >= 0; r--) {          // top row first in the DOM
      for (let c = 0; c < 8; c++) {
        const b = document.createElement('button');
        b.className = 'pad';
        b.dataset.i = r * 8 + c;
        const lbl = document.createElement('span');
        lbl.className = 'lbl';
        b.appendChild(lbl);
        padEls[r * 8 + c] = b;
        frag.appendChild(b);
      }
    }
    $('grid').replaceChildren(frag);
    return padEls;
  }

  /** Replace the readout text, sliding it in when it changes. */
  function setReadout(html) {
    const el = $('readout'), dir = readoutDir;
    readoutDir = 0;
    if (el.dataset.html === html) return;
    el.dataset.html = html;
    el.innerHTML = `<div class="ro">${html}</div>`;
    anim(el.firstChild, [
      { opacity: 0, transform: dir ? `translateX(${dir * 22}px)` : 'translateY(5px)' },
      { opacity: 1, transform: 'none' },
    ], { duration: 260, easing: EASE });
  }

  function renderReadout() {
    const s = eff(), ch = currentChord(), el = $('readout');
    el.classList.remove('warn');
    if (!ch) {
      const p = playProg();
      if (p) {
        setReadout(`<div class="notes">No chords yet</div><div class="small">Tap Edit to add some</div>`);
        return;
      }
      const f = Music.usesFlats(s.key, s.scale);
      setReadout(`<div class="notes">${Music.scaleNotes(s.key, s.scale).map(pc => Music.noteName(pc, f)).join(' ')}</div>
        <div class="small">${s.key} ${s.scale} – bottom-left ${grid[0].fullName} (MIDI ${grid[0].midi})</div>`);
      return;
    }
    const name = Music.chordName(ch, s), num = Music.romanNumeral(ch, s);
    const notes = Music.chordNoteNames(ch, s).join(' ');
    const extra = ch.source === 'borrowed' ? ` <span class="src">· from ${s.key} ${ch.sourceMode}</span>` : '';
    let small = '';
    if (!shape.primary && !shape.missing.length) { small = 'Doesn’t fit on the grid at this octave'; el.classList.add('warn'); }
    else if (shape.anchorMissed) { small = 'Doesn’t fit from that pad'; el.classList.add('warn'); }
    setReadout(`<div class="big">${name} <span class="sep">–</span> <span class="num">${num}</span></div>
      <div class="notes">${notes}${extra}</div>${small ? `<div class="small">${small}</div>` : ''}`);
  }

  function renderMissing() {
    const m = shape ? shape.missing : [];
    $('missing').hidden = !m.length;
    $('missingText').textContent = m.length ? Music.missingMessage(m) : '';
  }

  function renderRefControls() {
    const s = eff(), type = refChord ? refChord.type : 'triad';
    $('diatonic').innerHTML = diatonicHTML(s, refChord, type);
    $('borrowed').innerHTML = borrowedHTML(s, refChord, type);
    $('types').innerHTML = typesHTML(refChord ? refChord.type : null);
    $('inversion').innerHTML = `<small>Inversion</small>${INV_LABELS[refChord ? refChord.inversion : 0]}`;
    $('inversion').disabled = !refChord;
  }

  function renderPlayControls() {
    const p = playProg();
    if (!p) return;
    const s = eff();
    $('playName').textContent = `${p.name} – ${p.key} ${p.scale}`;
    const filled = p.slots.map((c, i) => [c, i]).filter(([c]) => c);
    $('strip').innerHTML = filled.length
      ? filled.map(([c, i]) => `<button class="slot-chip" data-slot="${i}" aria-current="${i === playIndex}"
          aria-label="Slot ${i + 1}: ${esc(Music.chordName(c, s))}">${Music.romanNumeral(c, s)}</button>`).join('')
      : `<span class="empty">Empty – tap Edit to add chords</span>`;
    $('prev').disabled = $('next').disabled = filled.length < 2;
  }

  /* ---------- rendering: progressions tab ---------- */

  function renderList() {
    const items = progressions.map(p => `
      <li class="prog-item">
        <button class="main" data-act="edit" data-id="${p.id}">
          <b>${esc(p.name)}</b>
          <small>${p.key} ${p.scale} · ${Music.progressionSummary(p)}</small>
        </button>
        <button class="side play-it" data-act="play" data-id="${p.id}" aria-label="Play ${esc(p.name)}">▶</button>
        <button class="side" data-act="menu" data-id="${p.id}" aria-label="More for ${esc(p.name)}">⋯</button>
      </li>`).join('');
    const presets = Music.PRESETS.map((pr, i) => `
      <li class="prog-item">
        <button class="main" data-act="preset" data-preset="${i}">
          <b>${pr.name}</b><small>${pr.scale} · copies into ${settings.key}</small>
        </button>
        <button class="side" data-act="preset" data-preset="${i}" aria-label="Copy ${pr.name}">＋</button>
      </li>`).join('');
    $('progView').innerHTML = `
      <div class="prog-head"><h2>Progressions</h2><button class="ghost-btn primary" data-act="new">＋ New</button></div>
      ${progressions.length ? `<ul class="prog-list">${items}</ul>` : `<p class="prog-empty">No progressions yet. Start a new one or copy a preset.</p>`}
      <h3>Presets</h3>
      <ul class="prog-list">${presets}</ul>`;
  }

  function renderEditor() {
    const p = progById(editId);
    if (!p) { view = 'list'; renderList(); return; }
    const s = Music.progressionSettings(p, settings);
    const keyOpts = Music.KEYS.map(k => `<option ${k.name === p.key ? 'selected' : ''}>${k.name}</option>`).join('');
    const scaleOpts = Music.SCALES.map(x => `<option ${x.name === p.scale ? 'selected' : ''}>${x.name}</option>`).join('');
    const slots = p.slots.map((c, i) => `
      <li class="slot">
        <span class="idx">${i + 1}</span>
        <button class="pick ${c ? '' : 'empty'}" data-act="pick" data-slot="${i}">
          ${c ? `<span class="num">${Music.romanNumeral(c, s)}</span> – ${Music.chordName(c, s)}` : 'Empty – tap to choose'}
        </button>
        <button class="mini" data-act="up" data-slot="${i}" aria-label="Move slot ${i + 1} up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="mini" data-act="down" data-slot="${i}" aria-label="Move slot ${i + 1} down" ${i === p.slots.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="mini" data-act="clear" data-slot="${i}" aria-label="Clear slot ${i + 1}" ${c ? '' : 'disabled'}>✕</button>
      </li>`).join('');
    $('progView').innerHTML = `
      <div class="prog-head">
        <button class="text-btn" data-act="back">‹ Progressions</button>
        <span style="flex:1"></span>
        <button class="ghost-btn primary" data-act="play" data-id="${p.id}">▶ Play</button>
      </div>
      <input id="progName" class="name-input" value="${esc(p.name)}" aria-label="Progression name" maxlength="60">
      <div class="bar-row">
        <label class="sel"><span>Key</span><select id="progKey">${keyOpts}</select></label>
        <label class="sel grow"><span>Scale</span><select id="progScale">${scaleOpts}</select></label>
      </div>
      <ol class="slots">${slots}</ol>`;
  }

  function renderPicker() {
    const p = progById(editId);
    if (pickSlot == null || !p) return;
    const s = Music.progressionSettings(p, settings), ch = p.slots[pickSlot];
    const type = ch ? ch.type : pickType;
    $('pickTitle').textContent = `Slot ${pickSlot + 1} – ${p.key} ${p.scale}`;
    $('pickReadout').innerHTML = ch
      ? `${Music.chordName(ch, s)} – <span class="num">${Music.romanNumeral(ch, s)}</span> – ${Music.chordNoteNames(ch, s).join(' ')}`
      : '<span class="small">Choose a chord</span>';
    $('pickDiatonic').innerHTML = diatonicHTML(s, ch, type);
    $('pickBorrowed').innerHTML = borrowedHTML(s, ch, type);
    $('pickTypes').innerHTML = typesHTML(type);
    $('pickInversion').innerHTML = `<small>Inversion</small>${INV_LABELS[ch ? ch.inversion : 0]}`;
    $('pickInversion').disabled = !ch;
    $('pickClear').disabled = !ch;
    updateThumbs();
  }

  function render() {
    if (view === 'play' && !playProg()) view = 'list';
    $('stage').hidden = !(view === 'reference' || view === 'play');
    $('progView').hidden = !$('stage').hidden;
    $('refControls').hidden = view !== 'reference';
    $('playControls').hidden = view !== 'play';
    const tab = view === 'reference' ? 'reference' : 'progressions';
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    if (!$('stage').hidden) {
      computeShape();
      renderHeader(); renderGrid(); renderReadout(); renderMissing();
      if (view === 'reference') renderRefControls(); else renderPlayControls();
    } else if (view === 'edit') {
      renderEditor(); renderPicker();
    } else {
      renderList();
    }
    updateThumbs();
  }

  /* ---------- pads ---------- */

  function noteUp(pointerId) {
    const v = heldPads.get(pointerId);
    if (v) { Synth.noteOff(v); heldPads.delete(pointerId); }
  }

  function onPad(i, pointerId) {
    const p = grid[i];
    if (!p || !p.valid) return;
    // The note sounds while the pad is held, like the Push.
    Synth.unlock();
    noteUp(pointerId);
    heldPads.set(pointerId, Synth.noteOn(p.midi));
    // Tapping a pad with the bass pitch class also anchors the shape there.
    if (shape && p.pc === shape.anchorPc) { anchor = i; computeShape(); renderGrid(); renderReadout(); }
    else strike([i]);
  }

  /* ---------- sheets ---------- */

  function openSheet(open) {
    if (open) { showLayer($('sheet')); showOfflineInfo(); } else hideLayer($('sheet'));
  }

  async function showOfflineInfo() {
    let text = 'Offline use needs the app to be opened from the web once.';
    try {
      const keys = window.caches ? await caches.keys() : [];
      const k = keys.filter(n => n.startsWith('pad-shapes-')).pop();   // newest
      if (k) text = `Works offline – cached version ${k.replace('pad-shapes-', '')}.`;
    } catch (e) {}
    $('offlineInfo').textContent = text;
  }

  function openPicker(slot) {
    pickSlot = slot;
    renderPicker();
    showLayer($('pickSheet'));
  }
  function closePicker() {
    pickSlot = null;
    hideLayer($('pickSheet'));
  }
  function setSlot(chord) {
    updateProg(editId, p => { p.slots[pickSlot] = chord ? Music.normaliseChord(chord) : null; });
    renderEditor(); renderPicker();
  }
  /** Audition the slot chord, since the editor has no grid. */
  function auditionSlot() {
    const p = progById(editId), ch = p && p.slots[pickSlot];
    if (!ch) return;
    Synth.unlock();
    Synth.playChord(Music.chordMidi(ch, Music.progressionSettings(p, settings), null, null), { strum: settings.strum });
  }

  function openActions(title, actions) {
    $('actTitle').textContent = title;
    $('actButtons').innerHTML = actions.map((a, i) =>
      `<button class="ghost-btn ${a.danger ? 'danger' : ''}" data-i="${i}">${a.label}</button>`).join('')
      + `<button class="done" data-i="-1">Cancel</button>`;
    $('actButtons').onclick = e => {
      const b = e.target.closest('[data-i]');
      if (!b) return;
      hideLayer($('actSheet'));
      const a = actions[+b.dataset.i];
      if (a) a.run();
    };
    showLayer($('actSheet'));
  }

  function progMenu(id) {
    const p = progById(id);
    if (!p) return;
    openActions(p.name, [
      { label: 'Rename', run: () => {
        const name = prompt('Rename progression', p.name);
        if (name != null && name.trim()) { updateProg(id, q => { q.name = name.trim().slice(0, 60); }); render(); }
      } },
      { label: 'Duplicate', run: () => {
        addProg(Music.normaliseProgression({ ...p, id: newId(), name: `${p.name} (copy)`, updatedAt: Date.now() }));
        render();
      } },
      { label: 'Delete', danger: true, run: () => {
        if (!confirm(`Delete “${p.name}”? This can’t be undone.`)) return;
        progressions = progressions.filter(q => q.id !== id);
        saveProgressions();
        render();
      } },
    ]);
  }

  function exportProgressions() {
    const data = JSON.stringify({ app: 'pad-shapes', version: 1, exportedAt: new Date().toISOString(), progressions }, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = `pad-shapes-progressions-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function importProgressions(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const incoming = Music.parseBackup(String(reader.result));
        progressions = Music.mergeProgressions(progressions, incoming);
        saveProgressions();
        alert(`Imported ${incoming.length} progression${incoming.length === 1 ? '' : 's'}.`);
        render();
      } catch (e) {
        alert(e instanceof SyntaxError ? 'That file isn’t valid JSON.' : e.message);
      }
    };
    reader.readAsText(file);
  }

  /* ---------- wiring ---------- */

  function onSwipe(el, fn) {
    let x0 = null, y0 = null;
    el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; });
    el.addEventListener('pointerup', e => {
      if (x0 == null) return;
      const dx = e.clientX - x0, dy = e.clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) fn(dx < 0 ? 1 : -1);
    });
  }

  function init() {
    $('key').innerHTML = Music.KEYS.map(k => `<option value="${k.name}">${k.name}</option>`).join('');
    $('scale').innerHTML = Music.SCALES.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
    $('key').addEventListener('change', e => setSetting('key', e.target.value));
    $('scale').addEventListener('change', e => setSetting('scale', e.target.value));

    document.querySelectorAll('[data-set]').forEach(btn => btn.addEventListener('click', () => {
      const name = btn.dataset.set;
      setSetting(name, BOOLEAN_SETTINGS.has(name) ? btn.dataset.val === 'true' : btn.dataset.val);
    }));
    $('volume').addEventListener('input', e => setSetting('volume', +e.target.value));

    $('grid').addEventListener('pointerdown', e => {
      const b = e.target.closest('.pad');
      if (b) onPad(+b.dataset.i, e.pointerId);
    });
    // Released anywhere: the grid may have re-rendered under the finger.
    ['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, e => noteUp(e.pointerId)));
    $('grid').addEventListener('contextmenu', e => e.preventDefault());

    // Readout: tap to play; in play-through, swipe to step.
    let swiped = false;
    onSwipe($('readout'), dir => { if (view === 'play') { swiped = true; step(dir); } });
    onSwipe($('playControls'), dir => step(dir));
    $('readout').addEventListener('click', () => { if (swiped) { swiped = false; return; } playCurrent(); });
    $('readout').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playCurrent(); }
    });
    document.addEventListener('keydown', e => {
      if (view !== 'play' || e.target.closest('input, select')) return;
      if (e.key === 'ArrowRight') step(1);
      if (e.key === 'ArrowLeft') step(-1);
    });
    $('toChromatic').addEventListener('click', () => setSetting('mode', 'chromatic'));

    // Reference pickers
    $('diatonic').addEventListener('click', e => {
      const b = e.target.closest('[data-degree]');
      if (!b) return;
      // Tapping the lit chord again clears it, leaving the plain grid.
      setRefChord(sameChordButton(b, refChord) ? null : chordFromButton(b, refChord));
    });
    $('borrowed').addEventListener('click', e => {
      const b = e.target.closest('[data-degree]');
      if (!b) return;
      setRefChord(sameChordButton(b, refChord) ? null : chordFromButton(b, refChord));
    });
    $('types').addEventListener('click', e => {
      const b = e.target.closest('[data-type]');
      if (b) setRefChord({ ...(refChord || { degree: 1 }), type: b.dataset.type });
    });
    $('inversion').addEventListener('click', () => {
      if (refChord) setRefChord({ ...refChord, inversion: (refChord.inversion + 1) % Music.chordSize(refChord) });
    });

    // Play-through
    $('prev').addEventListener('click', () => step(-1));
    $('next').addEventListener('click', () => step(1));
    $('strip').addEventListener('click', e => {
      const b = e.target.closest('[data-slot]');
      if (!b) return;
      const to = +b.dataset.slot;
      readoutDir = Math.sign(to - playIndex);
      playIndex = to;
      anchor = null;
      render();
      playCurrent();
    });
    $('playEdit').addEventListener('click', () => openEditor(playId));
    $('playExit').addEventListener('click', () => go('list'));

    // Tabs
    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      go(b.dataset.tab === 'reference' ? 'reference' : 'list');
    }));

    // Progressions tab (list and editor share one container)
    $('progView').addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act, id = b.dataset.id, slot = +b.dataset.slot;
      if (act === 'new') {
        const n = progressions.length + 1;
        openEditor(addProg(Music.makeProgression({ id: newId(), name: `Progression ${n}`, key: settings.key, scale: settings.scale, now: Date.now() })).id);
      } else if (act === 'preset') {
        const pr = Music.PRESETS[+b.dataset.preset];
        openEditor(addProg(Music.presetProgression(pr, settings.key, newId(), Date.now())).id);
      } else if (act === 'edit') openEditor(id);
      else if (act === 'play') startPlay(id);
      else if (act === 'menu') progMenu(id);
      else if (act === 'back') go('list');
      else if (act === 'pick') openPicker(slot);
      else if (act === 'up' || act === 'down') {
        const to = slot + (act === 'up' ? -1 : 1);
        updateProg(editId, p => { p.slots = Music.moveSlot(p.slots, slot, to); });
        renderEditor();
        // The two rows swap places with a short slide.
        const rows = $('progView').querySelectorAll('.slot');
        const h = rows[0] ? rows[0].offsetHeight + 5 : 0;
        anim(rows[to], [{ transform: `translateY(${(slot - to) * h}px)` }, { transform: 'none' }], { duration: 260, easing: EASE });
        anim(rows[slot], [{ transform: `translateY(${(to - slot) * h}px)` }, { transform: 'none' }], { duration: 260, easing: EASE });
      } else if (act === 'clear') {
        updateProg(editId, p => { p.slots[slot] = null; });
        renderEditor();
      }
    });
    $('progView').addEventListener('change', e => {
      if (e.target.id === 'progKey' || e.target.id === 'progScale') {
        // Chords are degrees, so this transposes the whole progression.
        updateProg(editId, p => { p[e.target.id === 'progKey' ? 'key' : 'scale'] = e.target.value; });
        renderEditor();
      }
    });
    $('progView').addEventListener('input', e => {
      if (e.target.id === 'progName') updateProg(editId, p => { p.name = e.target.value.slice(0, 60) || 'Untitled'; });
    });

    // Slot picker
    const pickChord = e => {
      const b = e.target.closest('[data-degree]');
      if (!b) return;
      const p = progById(editId), cur = p.slots[pickSlot];
      setSlot(chordFromButton(b, cur || { type: pickType, inversion: 0 }));
      auditionSlot();
    };
    $('pickDiatonic').addEventListener('click', pickChord);
    $('pickBorrowed').addEventListener('click', pickChord);
    $('pickTypes').addEventListener('click', e => {
      const b = e.target.closest('[data-type]');
      if (!b) return;
      pickType = b.dataset.type;
      const cur = progById(editId).slots[pickSlot];
      if (cur) { setSlot({ ...cur, type: pickType }); auditionSlot(); } else renderPicker();
    });
    $('pickInversion').addEventListener('click', () => {
      const cur = progById(editId).slots[pickSlot];
      if (cur) { setSlot({ ...cur, inversion: (cur.inversion + 1) % Music.chordSize(cur) }); auditionSlot(); }
    });
    $('pickClear').addEventListener('click', () => setSlot(null));
    $('pickDone').addEventListener('click', closePicker);
    $('pickSheet').addEventListener('click', e => { if (e.target === $('pickSheet')) closePicker(); });
    $('actSheet').addEventListener('click', e => { if (e.target === $('actSheet')) hideLayer($('actSheet')); });

    // Settings sheet
    $('gear').addEventListener('click', () => openSheet(true));
    $('summary').addEventListener('click', () => openSheet(true));
    $('sheetDone').addEventListener('click', () => openSheet(false));
    $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) openSheet(false); });
    $('octDown').addEventListener('click', () => setSetting('octave', settings.octave - 1));
    $('octUp').addEventListener('click', () => setSetting('octave', settings.octave + 1));
    $('exportBtn').addEventListener('click', exportProgressions);
    $('importBtn').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      if (f) importProgressions(f);
      e.target.value = '';
    });

    // Older iOS only unlocks audio on touchend or click, not pointerdown.
    const unlockOnce = () => Synth.unlock();
    document.addEventListener('touchend', unlockOnce, { once: true, passive: true });
    document.addEventListener('click', unlockOnce, { once: true });

    Synth.setVolume(settings.volume);
    $('app').hidden = false;
    render();
    window.addEventListener('resize', updateThumbs);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateThumbs);
  }

  return { init };
})();

if (new URLSearchParams(location.search).has('test')) renderTests(runTests());
else UI.init();

/* =====================================================================
   OFFLINE – service worker (needs https or localhost, so not on file://).
   ===================================================================== */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // A new version took over: offer a reload (not on the very first install).
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) document.getElementById('updateToast').hidden = false;
  });
  document.getElementById('updateReload').addEventListener('click', () => location.reload());
  document.getElementById('updateLater').addEventListener('click', () => { document.getElementById('updateToast').hidden = true; });
}
</script>
</body>
</html>
